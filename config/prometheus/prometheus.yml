global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: watchsync

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - Host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 10s

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # PostgreSQL Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Service metrics
  - job_name: 'auth-service'
    static_configs:
      - targets: ['auth-service:8080']
    metrics_path: /metrics

  - job_name: 'room-service'
    static_configs:
      - targets: ['room-service:8080']
    metrics_path: /metrics

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8080']
    metrics_path: /metrics

  - job_name: 'video-service'
    static_configs:
      - targets: ['video-service:8080']
    metrics_path: /metrics

  - job_name: 'chat-service'
    static_configs:
      - targets: ['chat-service:8080']
    metrics_path: /metrics

  - job_name: 'sync-service'
    static_configs:
      - targets: ['sync-service:8080']
    metrics_path: /metrics

  - job_name: 'ws-gateway'
    static_configs:
      - targets: ['ws-gateway:8080']
    metrics_path: /metrics

  - job_name: 'media-server'
    static_configs:
      - targets: ['media-server:8080']
    metrics_path: /metrics

  # ScyllaDB metrics
  - job_name: 'scylla'
    static_configs:
      - targets: ['scylla:9180']

  # MinIO metrics
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/v2/metrics/cluster

  # NATS metrics
  - job_name: 'nats'
    static_configs:
      - targets: ['nats:8222']
    metrics_path: /metrics
