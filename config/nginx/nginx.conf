user nginx;
worker_processes 2;
worker_rlimit_nofile 8192;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    aio off;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100G;
    client_body_buffer_size 128k;
    client_body_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Docker internal DNS — dynamic resolution so nginx starts before upstreams are ready
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:100m inactive=24h max_size=1g;

    # SSL settings (shared)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host:8443$request_uri;
    }

    # Main server block (HTTPS)
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Dynamic upstream variables — resolved at request time via Docker DNS
        set $upstream_ws       "http://ws-gateway:8080";
        set $upstream_api      "http://kong:8000";
        set $upstream_frontend "http://frontend:80";
        set $upstream_media    "http://media-server:8080";
        set $upstream_nats     "http://nats:8222";
        set $upstream_scylla   "http://scylla:10000";
        set $upstream_minio    "http://minio:9000";

        # Custom error responses
        error_page 401 @err401;
        error_page 403 @err403;
        error_page 404 @err404;
        error_page 429 @err429;
        error_page 502 503 504 @err503;

        location @err401 { default_type application/json; return 401 '{"error":"unauthorized","message":"Authentication required"}'; }
        location @err403 { default_type application/json; return 403 '{"error":"forbidden","message":"Access denied"}'; }
        location @err404 { default_type application/json; return 404 '{"error":"not_found","message":"Resource not found"}'; }
        location @err429 { default_type application/json; return 429 '{"error":"rate_limited","message":"Too many requests, slow down"}'; }
        location @err503 { default_type application/json; return 503 '{"error":"unavailable","message":"Service temporarily unavailable"}'; }

        # Static files caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            proxy_pass $upstream_frontend;
        }

        # NATS monitoring proxy — rewrite strips /api/infra/nats/ prefix before upstream
        location /api/infra/nats/ {
            rewrite ^/api/infra/nats/(.*)$ /$1 break;
            proxy_pass $upstream_nats;
            proxy_set_header Host nats;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-store" always;
            proxy_read_timeout 5s;
        }

        # ScyllaDB REST API proxy — rewrite strips /api/infra/scylla/ prefix before upstream
        location /api/infra/scylla/ {
            rewrite ^/api/infra/scylla/(.*)$ /$1 break;
            proxy_pass $upstream_scylla;
            proxy_set_header Host scylla;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-store" always;
            proxy_read_timeout 5s;
        }

        # Service health checks — bypass Kong, direct to each service
        location = /api/health/auth       { set $h http://auth-service:8080;    rewrite ^.*$ /health break; proxy_pass $h; access_log off; }
        location = /api/health/user       { set $h http://user-service:8080;    rewrite ^.*$ /health break; proxy_pass $h; access_log off; }
        location = /api/health/room       { set $h http://room-service:8080;    rewrite ^.*$ /health break; proxy_pass $h; access_log off; }
        location = /api/health/video      { set $h http://video-service:8080;   rewrite ^.*$ /health break; proxy_pass $h; access_log off; }
        location = /api/health/ws         { set $h http://ws-gateway:8080;      rewrite ^.*$ /health break; proxy_pass $h; access_log off; }
        location = /api/health/sync       { set $h http://sync-service:8080;    rewrite ^.*$ /health break; proxy_pass $h; access_log off; }
        location = /api/health/chat       { set $h http://chat-service:8080;    rewrite ^.*$ /health break; proxy_pass $h; access_log off; }
        location = /api/health/kong       { set $h http://kong:8001;            rewrite ^.*$ /status break; proxy_pass $h; access_log off; }
        location = /api/health/grafana    { set $h http://grafana:3000;         rewrite ^.*$ /api/health break; proxy_pass $h; access_log off; }
        location = /api/health/prometheus { set $h http://prometheus:9090;      rewrite ^.*$ /-/healthy break;  proxy_pass $h; access_log off; }
        location = /api/health/jaeger     { set $h http://jaeger:16686;         rewrite ^.*$ / break;       proxy_pass $h; access_log off; }
        location = /api/health/minio      { set $h http://minio:9000;           rewrite ^.*$ /minio/health/live break; proxy_pass $h; access_log off; }

        # Video streaming — proxy through video-service so the ownership check
        # actually runs (video-service verifies the token, enforces per-room
        # access, then streams from MinIO with Range support + chunk cache).
        location ~* ^/api/v1/videos/stream/ {
            set $upstream_video "http://video-service:8080";
            proxy_pass $upstream_video;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Expose-Headers "Content-Range, Accept-Ranges, Content-Length" always;
        }

        # Auth rate limiting
        location /api/v1/auth {
            limit_req zone=auth burst=20 nodelay;
            limit_req_status 429;
            limit_conn conn 10;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
        }

        # DM REST API (ws-gateway)
        location /api/v1/dm/ {
            limit_req zone=api burst=60 nodelay;
            limit_req_status 429;
            proxy_pass $upstream_ws;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            limit_req_status 429;
            proxy_pass $upstream_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_intercept_errors on;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass $upstream_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Media server proxy
        location /media/ {
            proxy_pass $upstream_media/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
        }

        # Desktop app downloads (auto-update)
        location /downloads/ {
            alias /usr/share/nginx/downloads/;
            autoindex off;
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "*";
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # React Router — SPA fallback
        location / {
            proxy_pass $upstream_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
