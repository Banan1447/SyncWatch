name: Go Services CI

on:
  push:
    paths:
      - 'services/auth/**'
      - 'services/chat/**'
      - 'services/room/**'
      - 'services/sync/**'
      - 'services/transcoder/**'
      - 'services/user/**'
      - 'services/video/**'
      - 'services/ws-gateway/**'
  pull_request:
    paths:
      - 'services/auth/**'
      - 'services/chat/**'
      - 'services/room/**'
      - 'services/sync/**'
      - 'services/transcoder/**'
      - 'services/user/**'
      - 'services/video/**'
      - 'services/ws-gateway/**'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth
          - chat
          - room
          - sync
          - transcoder
          - user
          - video
          - ws-gateway

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -race -count=1
