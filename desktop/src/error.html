<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<title>WatchSync — Ошибка подключения</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #09090f;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    padding: 2rem;
    text-align: center;
    -webkit-app-region: drag;
  }
  .icon { font-size: 3rem; }
  h1 { font-size: 1.2rem; font-weight: 700; color: #f87171; }
  p { font-size: 0.85rem; color: rgba(255,255,255,0.4); max-width: 360px; line-height: 1.6; }
  .actions { display: flex; gap: 0.75rem; -webkit-app-region: no-drag; }
  button {
    padding: 0.6rem 1.2rem;
    border: none;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  .btn-retry { background: #7c6ff7; color: #fff; }
  .btn-setup { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }
</style>
</head>
<body>
<div class="icon">📡</div>
<h1>Не удалось подключиться к серверу</h1>
<p>Убедитесь, что WatchSync сервер запущен и доступен по указанному адресу.</p>
<div class="actions">
  <button class="btn-retry" onclick="location.reload()">Повторить</button>
  <button class="btn-setup" onclick="window.electronAPI?.openSetup()">Изменить адрес</button>
</div>
</body>
</html>
