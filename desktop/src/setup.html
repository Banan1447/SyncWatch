<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>WatchSync — Подключение</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #09090f;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
    overflow: hidden;
  }

  /* Custom titlebar */
  .titlebar {
    height: 32px;
    background: rgba(255,255,255,0.03);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    -webkit-app-region: drag;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    flex-shrink: 0;
  }
  .titlebar-controls {
    display: flex;
    -webkit-app-region: no-drag;
  }
  .tb-btn {
    width: 46px; height: 32px;
    background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .tb-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .tb-btn.close:hover { background: #e81123; color: #fff; }

  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    gap: 1.5rem;
  }

  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
  }
  .logo-icon {
    width: 64px; height: 64px;
    background: rgba(124,111,247,0.15);
    border: 1.5px solid rgba(124,111,247,0.3);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .logo-title {
    font-size: 1.5rem;
    font-weight: 800;
    background: linear-gradient(135deg, #7c6ff7, #ff6b9d);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  .logo-sub {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.4);
    text-align: center;
  }

  .form {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  label {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  input {
    width: 100%;
    padding: 0.65rem 0.9rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: #fff;
    font-size: 0.9rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: #7c6ff7; }
  input::placeholder { color: rgba(255,255,255,0.2); }

  .presets {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .preset {
    padding: 0.3rem 0.7rem;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    color: rgba(255,255,255,0.5);
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .preset:hover {
    background: rgba(124,111,247,0.15);
    border-color: rgba(124,111,247,0.4);
    color: #7c6ff7;
  }

  .btn-connect {
    width: 100%;
    padding: 0.75rem;
    background: linear-gradient(135deg, #7c6ff7, #6c5fd7);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    margin-top: 0.25rem;
  }
  .btn-connect:hover { opacity: 0.9; }
  .btn-connect:active { transform: scale(0.98); }
  .btn-connect:disabled { opacity: 0.5; cursor: default; }

  .status {
    font-size: 0.8rem;
    text-align: center;
    min-height: 1.2em;
    color: rgba(255,255,255,0.4);
  }
  .status.error { color: #f87171; }
  .status.ok { color: #4ade80; }

  .opts {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 1rem;
  }
  .opt-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.5);
  }
  .toggle {
    width: 36px; height: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    position: relative;
    cursor: pointer;
    transition: background 0.2s;
    border: none;
    flex-shrink: 0;
  }
  .toggle.on { background: #7c6ff7; }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    background: #fff;
    border-radius: 50%;
    transition: left 0.2s;
  }
  .toggle.on::after { left: 18px; }
</style>
</head>
<body>

<div class="titlebar">
  <div class="titlebar-controls">
    <button class="tb-btn close" onclick="window.electronAPI.close()" title="Закрыть">
      <svg width="10" height="10" viewBox="0 0 10 10">
        <line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.2"/>
        <line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2"/>
      </svg>
    </button>
  </div>
</div>

<div class="content">
  <div class="logo">
    <div class="logo-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#7c6ff7" stroke-width="1.5"/>
        <polygon points="10,8 17,12 10,16" fill="#7c6ff7"/>
      </svg>
    </div>
    <div class="logo-title">WatchSync</div>
    <div class="logo-sub">Введите адрес вашего WatchSync сервера</div>
  </div>

  <div class="form">
    <label>Адрес сервера</label>
    <input id="urlInput" type="url" placeholder="https://<your-server>:8443" autocomplete="off" spellcheck="false"/>

    <div class="presets">
      <span class="preset" onclick="setUrl('https://localhost:8443')">localhost</span>
      <span class="preset" id="lanPreset" onclick="setUrl('')">LAN IP</span>
    </div>

    <button class="btn-connect" id="connectBtn" onclick="connect()">Подключиться</button>
    <div class="status" id="status"></div>
  </div>

  <div class="opts">
    <div class="opt-row">
      <span>Запускать при старте Windows</span>
      <button class="toggle" id="toggleAutostart" onclick="toggleSetting('autostart', this)"></button>
    </div>
    <div class="opt-row">
      <span>Сворачивать в трей при закрытии</span>
      <button class="toggle" id="toggleTray" onclick="toggleSetting('minimizeToTray', this)"></button>
    </div>
    <div class="opt-row">
      <span>Уведомления</span>
      <button class="toggle" id="toggleNotify" onclick="toggleSetting('notifications', this)"></button>
    </div>
  </div>
</div>

<script>
const api = window.electronAPI;

async function init() {
  const url = await api.getServerUrl();
  document.getElementById('urlInput').value = url || '';

  // Try to detect LAN IP from server URL
  const lanPreset = document.getElementById('lanPreset');
  try {
    const stored = new URL(url);
    if (stored.hostname !== 'localhost' && stored.hostname !== '127.0.0.1') {
      lanPreset.textContent = stored.hostname;
      lanPreset.onclick = () => setUrl(url);
    }
  } catch { lanPreset.style.display = 'none'; }

  // Load settings
  const tray = await api.getSetting('minimizeToTray');
  const notif = await api.getSetting('notifications');
  const autostart = await api.getAutostart();  // read from system registry

  setToggle('toggleTray', tray !== false);
  setToggle('toggleNotify', notif !== false);
  setToggle('toggleAutostart', !!autostart);
}

function setToggle(id, val) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('on', val);
}

function setUrl(url) {
  document.getElementById('urlInput').value = url;
}

async function toggleSetting(key, btn) {
  const isOn = btn.classList.contains('on');
  btn.classList.toggle('on', !isOn);
  await api.setSetting(key, !isOn);
}

async function connect() {
  const raw = document.getElementById('urlInput').value.trim();
  const btn = document.getElementById('connectBtn');
  const status = document.getElementById('status');

  if (!raw) { showStatus('Введите адрес сервера', 'error'); return; }

  let url;
  try {
    url = new URL(raw.startsWith('http') ? raw : 'https://' + raw);
  } catch {
    showStatus('Неверный адрес', 'error');
    return;
  }

  btn.disabled = true;
  showStatus('Проверка подключения…');

  try {
    await api.setServerUrl(url.origin);
    showStatus('Подключено!', 'ok');
  } catch (e) {
    showStatus('Ошибка: ' + e.message, 'error');
    btn.disabled = false;
  }
}

function showStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

document.getElementById('urlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') connect();
});

init();
</script>
</body>
</html>
