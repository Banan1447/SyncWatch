user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # Upstream definitions
    upstream ws_gateway {
        least_conn;
        server ws-gateway-1:8080 weight=5;
        server ws-gateway-2:8080 weight=5;
        server ws-gateway-3:8080 weight=5;
        keepalive 32;
    }

    upstream api_gateway {
        server kong:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
        keepalive 32;
    }

    # Cache configuration
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:100m inactive=24h max_size=1g;

    # WebSocket server block
    server {
        listen 80;
        server_name ws.watchsync.local;

        location /ws {
            proxy_pass http://ws_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket specific
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 7d;

            # Buffer settings
            proxy_buffering off;
            proxy_request_buffering off;

            # Retry settings
            proxy_next_upstream error timeout http_502 http_503;
        }
    }

    # API server block
    server {
        listen 80;
        server_name api.watchsync.local;

        # Rate limiting for auth endpoints
        location /api/v1/auth {
            limit_req zone=auth burst=20 nodelay;
            limit_conn conn 10;
            proxy_pass http://api_gateway;
            include /etc/nginx/proxy_params.conf;
        }

        # General API rate limiting
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://api_gateway;
            include /etc/nginx/proxy_params.conf;
        }

        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Main frontend server
    server {
        listen 80;
        server_name watchsync.local localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Static files caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status $upstream_cache_status;
            proxy_cache STATIC;
            proxy_cache_valid 200 1y;
            proxy_pass http://frontend;
        }

        # API proxy
        location /api/ {
            proxy_pass http://api_gateway;
            include /etc/nginx/proxy_params.conf;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass http://ws_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Media server proxy
        location /media/ {
            proxy_pass http://media-server:8080/;
            include /etc/nginx/proxy_params.conf;
            proxy_buffering off;
        }

        # React Router support
        location / {
            try_files $uri $uri/ /index.html;
            proxy_pass http://frontend;
            include /etc/nginx/proxy_params.conf;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# Stream block for RTMP (if needed)
stream {
    # RTMP upstream
    upstream rtmp_backend {
        server transcoder:1935;
    }

    server {
        listen 1935;
        proxy_pass rtmp_backend;
        proxy_timeout 3s;
        proxy_connect_timeout 1s;
    }
}
