# =============================================================================
# Coturn TURN Server Configuration
# For WebRTC NAT traversal
# =============================================================================

# Listener configuration
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

# Network
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=${EXTERNAL_IP}

# Relay ports
min-port=49152
max-port=65535

# Authentication
lt-cred-mech
user=watchsync:watchsync123
user=turn:turn123
realm=watchsync.local

# OR use shared secret (recommended for production)
# use-auth-secret
# static-auth-secret=${TURN_SECRET}

# TLS/DTLS (optional but recommended)
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
# cipher-list="ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"
# dh-file=/etc/coturn/dhparam.pem

# Security
no-tcp-relay
no-multicast-peers
no-loopback-peers
stale-nonce=600
max-allocate-lifetime=3600
max-allocate-bandwidth=0

# DoS protection
user-quota=0
total-quota=0
max-bps=0

# Logging
log-file=/var/log/turnserver/turn.log
simple-log
verbose

# CLI (disabled for security)
no-cli

# Web Admin (disabled)
no-web-admin

# Mobility
mobility

# Performance
no-software-attribute
