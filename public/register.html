<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация - SyncWatch</title>
  <style>
    :root {
      --primary: #4a90e2;
      --secondary: #343a40;
      --accent: #007bff;
      --bg-dark: #121212;
      --bg-darker: #0d0d0d;
      --text: #ffffff;
      --text-secondary: #cccccc;
      --border: #333333;
      --shadow: rgba(0, 0, 0, 0.5);
      --hover-bg: #1e1e1e;
      --success: #28a745;
      --error: #dc3545;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--bg-dark), #1a1a2e);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .register-container {
      width: 100%;
      max-width: 400px;
      background: var(--bg-darker);
      border-radius: 12px;
      box-shadow: 0 8px 32px var(--shadow);
      padding: 2.5rem;
      border: 1px solid var(--border);
    }

    .logo-container {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a90e2, #8e44ad);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 1.5rem;
      margin: 0 auto 1rem;
    }

    .register-container h2 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: var(--primary);
    }

    .register-container p {
      text-align: center;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.2);
    }

    .register-btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--success);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-bottom: 1rem;
    }

    .register-btn:hover {
      background: #218838;
    }

    .register-btn:disabled {
      background: #6c757d;
      cursor: not-allowed;
    }

    .login-link {
      text-align: center;
      margin-top: 1rem;
    }

    .login-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .error-message {
      background: rgba(220, 53, 69, 0.1);
      border: 1px solid var(--error);
      color: var(--error);
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }

    .success-message {
      background: rgba(40, 167, 69, 0.1);
      border: 1px solid var(--success);
      color: var(--success);
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 1rem;
    }

    .spinner {
      border: 2px solid var(--border);
      border-top: 2px solid var(--primary);
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="register-container">
    <div class="logo-container">
      <div class="logo-icon">S</div>
      <h2>Регистрация</h2>
      <p>Создайте новую учетную запись</p>
    </div>

    <div id="errorMessage" class="error-message"></div>
    <div id="successMessage" class="success-message"></div>

    <form id="registerForm">
      <div class="form-group">
        <label for="regUsername">Имя пользователя</label>
        <input type="text" id="regUsername" name="username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" name="email" required autocomplete="email">
      </div>

      <div class="form-group">
        <label for="regPassword">Пароль</label>
        <input type="password" id="regPassword" name="password" required autocomplete="new-password" minlength="8">
      </div>

      <div class="form-group">
        <label for="regConfirmPassword">Подтверждение пароля</label>
        <input type="password" id="regConfirmPassword" name="confirmPassword" required autocomplete="new-password" minlength="8">
      </div>

      <button type="submit" class="register-btn" id="registerButton">Зарегистрироваться</button>
      
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Регистрация...</p>
      </div>
    </form>

    <div class="login-link">
      <p>Уже есть аккаунт? <a href="/login.html">Войти</a></p>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirmPassword = document.getElementById('regConfirmPassword').value;
      const registerButton = document.getElementById('registerButton');
      const errorMessage = document.getElementById('errorMessage');
      const successMessage = document.getElementById('successMessage');
      const loading = document.getElementById('loading');

      // Сброс сообщений
      errorMessage.style.display = 'none';
      successMessage.style.display = 'none';

      // Проверка валидности
      if (!username || !email || !password || !confirmPassword) {
        showError('Пожалуйста, заполните все поля');
        return;
      }

      if (password !== confirmPassword) {
        showError('Пароли не совпадают');
        return;
      }

      if (password.length < 8) {
        showError('Пароль должен быть не менее 8 символов');
        return;
      }

      // Проверка email формата
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email)) {
        showError('Неверный формат email');
        return;
      }

      // Показать загрузку
      registerButton.disabled = true;
      loading.style.display = 'block';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            username: username,
            email: email,
            password: password
          })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showSuccess('Регистрация успешна! Перенаправление на страницу входа...');
          
          // Перенаправляем на страницу входа после успешной регистрации
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 2000);
        } else {
          showError(data.error || 'Ошибка регистрации');
        }
      } catch (error) {
        console.error('Ошибка регистрации:', error);
        showError('Ошибка подключения к серверу');
      } finally {
        registerButton.disabled = false;
        loading.style.display = 'none';
      }
    });

    function showError(message) {
      const errorMessage = document.getElementById('errorMessage');
      errorMessage.textContent = message;
      errorMessage.style.display = 'block';
    }

    function showSuccess(message) {
      const successMessage = document.getElementById('successMessage');
      successMessage.textContent = message;
      successMessage.style.display = 'block';
    }
  </script>
  <!-- Подключаем общие API функции -->
  <script src="/js/api.js"></script>
</body>
</html>
