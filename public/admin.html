<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | SyncWatch</title>
    
    <!-- Стили -->
    <link rel="stylesheet" href="styles/main.css">
    
    <!-- Иконка (опционально) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <!-- Шапка сайта -->
    <header class="header">
        <div class="logo-container">
            <div class="logo-icon">
                <div class="logo-svg">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#4a90e2" />
                                <stop offset="100%" stop-color="#8e44ad" />
                            </linearGradient>
                        </defs>
                        <circle cx="50" cy="50" r="48" fill="url(#logoGradient)" />
                        <text x="50" y="60" font-family="Arial, sans-serif" font-size="100" fill="white" text-anchor="middle" dominant-baseline="middle">S</text>
                    </svg>
                </div>
            </div>
            <h1>SyncWatch Admin Panel</h1>
        </div>
    </header>

    <!-- Основная часть -->
    <main class="admin-container">
        <!-- Раздел выбора папки -->
        <section class="admin-panel">
            <h2>Настройка папки с видео</h2>
            <div class="form-group">
                <label for="videoFolder">Путь к папке с видео:</label>
                <input type="text" id="videoFolder" placeholder="C:\Videos" required>
                <button id="saveFolderBtn">Сохранить путь</button>
            </div>
            <div id="statusMessage" class="status-message"></div>
        </section>

        <!-- Раздел смены порта -->
        <section class="admin-panel">
            <h2>Настройка порта сервера</h2>
            <div class="form-group">
                <label for="serverPort">Новый порт:</label>
                <input type="number" id="serverPort" placeholder="5000" min="1024" max="65535" value="5000">
                <button id="changePortBtn">Применить</button>
            </div>
            <div id="portStatusMessage" class="status-message"></div>
            <small>Примечание: после изменения порта требуется перезапуск сервера</small>
        </section>

        <!-- Текущие настройки -->
        <section class="admin-panel">
            <h2>Текущие настройки</h2>
            <div class="current-settings">
                <div>
                    <strong>Порт сервера:</strong> <span id="currentPort">Загрузка...</span>
                </div>
                <div>
                    <strong>Папка с видео:</strong> <span id="currentVideoDir">Загрузка...</span>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript файлы -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
