<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SyncWatch</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
  />
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    /* Простые стили для адаптивности */
    #youtubePlayer {
      width: 100%;
      height: 70vh; /* Большой плеер */
      min-height: 400px;
    }
    .main-container {
      display: flex;
      gap: 20px;
      padding: 10px;
    }
    .left-panel, .right-panel {
      flex: 1;
    }
    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 10px 16px;
      background: #4caf50;
      color: white;
      border-radius: 4px;
      z-index: 1000;
    }
    .notification.error { background: #f44336; }
  </style>
</head>
<body>
  <div class="header">
    <h1>SyncWatch</h1>
  </div>

  <div class="controls">
    <input
      type="text"
      id="youtubeUrl"
      placeholder="Вставьте ссылку на YouTube видео..."
    />
    <button id="addYoutubeBtn">Добавить в очередь</button>
    <button id="clearQueueBtn">Очистить очередь</button>
  </div>

  <div class="main-container">
    <div class="left-panel">
      <div id="youtubePlayer" style="display: none;"></div>
    </div>

    <div class="right-panel">
      <h3>Очередь (<span id="queueCount">0</span>)</h3>
      <div id="youtubeQueue"></div>
    </div>
  </div>

  <div id="notifications"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const youtubeUrlInput = document.getElementById('youtubeUrl');
    const addYoutubeBtn = document.getElementById('addYoutubeBtn');
    const clearQueueBtn = document.getElementById('clearQueueBtn');
    const youtubeQueue = document.getElementById('youtubeQueue');
    const queueCountEl = document.getElementById('queueCount');
    const youtubePlayerEl = document.getElementById('youtubePlayer');

    let player = null;
    let currentVideo = null;

    // === YouTube API ===
    function onYouTubeIframeAPIReady() {
      // Готов к созданию плеера
    }

    function loadYouTubePlayer(videoId) {
      youtubePlayerEl.style.display = 'block';
      if (player) {
        player.loadVideoById(videoId);
      } else {
        player = new YT.Player('youtubePlayer', {
          videoId: videoId,
          playerVars: {
            autoplay: 1,
            mute: 0,
            controls: 1,
            modestbranding: 1,
            rel: 0,
            playsinline: 1,
          },
          events: {
            onReady: (e) => e.target.playVideo(),
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.ENDED) {
                socket.emit('video-ended');
              }
            }
          }
        });
      }
    }

    // === ОБРАБОТКА СОКЕТОВ ===
    socket.on('queue-update', (queue) => {
      renderQueue(queue);
    });

    socket.on('play-video', (video) => {
      currentVideo = video;
      if (video) {
        loadYouTubePlayer(video.id);
        document.title = `▶ ${video.title} - SyncWatch`;
      } else {
        youtubePlayerEl.style.display = 'none';
        document.title = 'SyncWatch';
      }
    });

    socket.on('video-command', (data) => {
      if (!player) return;
      switch (data.type) {
        case 'play': player.playVideo(); break;
        case 'pause': player.pauseVideo(); break;
        case 'seek': player.seekTo(data.time, true); break;
      }
    });

    // === РЕНДЕР ОЧЕРЕДИ ===
    function renderQueue(queue) {
      queueCountEl.textContent = queue.length;
      youtubeQueue.innerHTML = queue.length === 0 
        ? '<p>Очередь пуста</p>' 
        : queue.map((v, i) => `
          <div style="padding: 8px; border-bottom: 1px solid #eee;">
            <strong>${i + 1}. ${v.title}</strong><br>
            <small>${v.duration}</small>
          </div>
        `).join('');
    }

    // === КНОПКИ ===
    addYoutubeBtn.addEventListener('click', () => {
      const url = youtubeUrlInput.value.trim();
      if (!url) return alert('Введите ссылку');
      socket.emit('add-video', url);
      youtubeUrlInput.value = '';
    });

    clearQueueBtn.addEventListener('click', () => {
      if (confirm('Очистить очередь для всех?')) {
        socket.emit('clear-queue');
      }
    });

    // Глобальные горячие клавиши (опционально)
    document.addEventListener('keydown', (e) => {
      if (!player) return;
      if (e.code === 'Space') {
        e.preventDefault();
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.CUED) {
          socket.emit('command', { type: 'play' });
        } else {
          socket.emit('command', { type: 'pause' });
        }
      }
    });
  </script>
</body>
</html>
