<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Health Checks</title>
  <style>
    :root {
      --primary: #4a90e2;
      --secondary: #343a40;
      --accent: #007bff;
      --bg-dark: #121212;
      --bg-darker: #0d0d0d;
      --text: #ffffff;
      --text-secondary: #cccccc;
      --border: #333333;
      --shadow: rgba(0, 0, 0, 0.5);
      --hover-bg: #1e1e1e;
      --progress-bg: #2c2c2c;
      --progress-fill: #007bff;
      --error: #dc3545;
      --success: #28a745;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.3s ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--bg-darker);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px var(--shadow);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .logo-container:hover {
      opacity: 0.8;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a90e2, #8e44ad); /* Сине-фиолетовый */
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      position: relative;
    }

    .logo-svg {
      width: 80%; /* Занимает 80% круга */
      height: 80%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-svg svg {
      width: 100%;
      height: 100%;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--primary);
    }

    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .back-link:hover {
      background: rgba(0, 123, 255, 0.1);
      color: #fff;
    }

    .main-container {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .checks-section {
      width: 100%;
      max-width: 800px;
      background: var(--bg-darker);
      border-radius: 8px;
      box-shadow: 0 4px 12px var(--shadow);
      padding: 2rem;
    }

    .checks-section h2 {
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
      color: var(--primary);
    }

    .check-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: var(--bg-dark);
      border-radius: 4px;
      border: 1px solid var(--border);
      margin-bottom: 0.5rem;
      transition: background 0.2s ease;
    }

    .check-item:hover {
      background: var(--hover-bg);
    }

    .check-info {
      flex: 1;
    }

    .check-name {
      font-size: 1.1rem;
      color: var(--text);
    }

    .check-url {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .check-result {
      padding: 0.5rem 1rem;
      border-radius: 4px;
      font-weight: 500;
    }

    .check-result.success {
      background: var(--success);
      color: white;
    }

    .check-result.error {
      background: var(--error);
      color: white;
    }

    .check-result.pending {
      background: var(--secondary);
      color: var(--text-secondary);
    }

    .run-all-btn {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s ease;
      margin-top: 1rem;
    }

    .run-all-btn:hover {
      background: #0056b3;
    }

    #notifications {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      max-width: 300px;
    }

    .notification {
      padding: 1rem;
      margin-bottom: 0.5rem;
      border-radius: 4px;
      box-shadow: 0 4px 12px var(--shadow);
      animation: slideIn 0.3s ease-out;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notification.success {
      background: rgba(40, 167, 69, 0.2);
      border-left: 4px solid var(--success);
      color: var(--success);
    }

    .notification.error {
      background: rgba(220, 53, 69, 0.2);
      border-left: 4px solid var(--error);
      color: var(--error);
    }

    .notification-close {
      background: none;
      border: none;
      color: inherit;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 0 0.5rem;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container" onclick="window.location.href='/select-room.html'">
      <div class="logo-icon">
        <div class="logo-svg">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <!-- Градиент -->
            <defs>
              <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4a90e2" />
                <stop offset="100%" stop-color="#8e44ad" />
              </linearGradient>
            </defs>

            <!-- Круговой фон -->
            <circle cx="50" cy="50" r="48" fill="url(#logoGradient)" />

            <!-- Буква S -->
            <text 
              x="50" 
              y="50" 
              font-family="Arial, sans-serif" 
              font-size="40" 
              fill="white" 
              text-anchor="middle" 
              dominant-baseline="middle"
              alignment-baseline="middle"
              style="paint-order: stroke; stroke: #000; stroke-width: 1px;"
            >
              S
            </text>
          </svg>
        </div>
      </div>
      <h1>SyncWatch</h1>
    </div>
    <a href="/select-room.html" class="back-link">Back to Rooms</a>
  </div>

  <div class="main-container">
    <div class="checks-section">
      <h2>Health Checks</h2>
      <button id="runAllBtn" class="run-all-btn">Run All Checks</button>
      <div id="checksList">
        <!-- Элементы проверок будут добавлены здесь -->
      </div>
    </div>
  </div>

  <div id="notifications"></div>

  <script>
    // Список проверок
    const checks = [
      { name: 'Server Status', url: '/api/system/status', method: 'GET' }, // Пример маршрута, может не существовать
      { name: 'Health Check', url: '/api/system/health', method: 'GET' },
      { name: 'Metrics', url: '/api/metrics/usage', method: 'GET' }, // Требует аутентификации
      { name: 'Transcode Queue', url: '/api/transcode/queue', method: 'GET' }, // Требует аутентификации
      { name: 'Video List', url: '/api/videos', method: 'GET' }, // Требует аутентификации
      { name: 'Rooms List (Socket)', url: '/api/rooms', method: 'GET' }, // Скорее всего, не существует как GET, проверка через сокет
      // Добавьте другие маршруты для проверки
    ];

    // Функция для выполнения одной проверки
    async function runCheck(check) {
      const startTime = Date.now();
      try {
        // const response = await fetch(check.url, {
        //   method: check.method,
        //   headers: {
        //     'Authorization': `Bearer ${authToken}` // УБРАНО: не нужно с заглушкой
        //   }
        // });
        const response = await fetch(check.url, { method: check.method });
        const duration = Date.now() - startTime;
        const data = await response.json();

        return {
          name: check.name,
          url: check.url,
          success: response.ok,
          status: response.status,
          duration: duration,
          data: data // Включаем данные ответа
        };
      } catch (error) {
        const duration = Date.now() - startTime;
        return {
          name: check.name,
          url: check.url,
          success: false,
          status: 'ERROR',
          duration: duration,
          error: error.message
        };
      }
    }

    // Функция для отображения результата проверки
    function displayCheckResult(result) {
      const checkList = document.getElementById('checksList');
      const checkItem = document.createElement('div');
      checkItem.className = 'check-item';

      let statusText = 'Pending...';
      let statusClass = 'pending';

      if (result.status !== 'PENDING') {
        statusText = result.success ? `OK (${result.status})` : `FAIL (${result.status || result.error})`;
        statusClass = result.success ? 'success' : 'error';
      }

      checkItem.innerHTML = `
        <div class="check-info">
          <div class="check-name">${result.name}</div>
          <div class="check-url">${result.url}</div>
          <div class="check-duration">Duration: ${result.duration}ms</div>
          ${result.data ? `<div class="check-data">Data: ${JSON.stringify(result.data).substring(0, 100)}...</div>` : ''}
        </div>
        <div class="check-result ${statusClass}">${statusText}</div>
      `;

      checkList.appendChild(checkItem);
    }

    // Функция для запуска всех проверок
    async function runAllChecks() {
      const checkList = document.getElementById('checksList');
      checkList.innerHTML = ''; // Очищаем предыдущие результаты

      for (const check of checks) {
        // Показываем начальное состояние
        displayCheckResult({ name: check.name, url: check.url, status: 'PENDING', duration: 0 });
      }

      // Ждем немного, чтобы обновить интерфейс
      await new Promise(resolve => setTimeout(resolve, 10));

      for (const check of checks) {
        const result = await runCheck(check);
        // Находим соответствующий элемент и обновляем его
        const checkItems = document.querySelectorAll('#checksList .check-item');
        checkItems.forEach(item => {
          const itemName = item.querySelector('.check-name').textContent;
          if (itemName === check.name) {
            item.querySelector('.check-result').textContent = result.success ? `OK (${result.status})` : `FAIL (${result.status || result.error})`;
            item.querySelector('.check-result').className = `check-result ${result.success ? 'success' : 'error'}`;
            item.querySelector('.check-duration').textContent = `Duration: ${result.duration}ms`;
            if (result.data) {
              const dataDiv = item.querySelector('.check-data');
              if (dataDiv) {
                dataDiv.textContent = `Data: ${JSON.stringify(result.data).substring(0, 100)}...`;
              }
            }
          }
        });
      }
    }

    // === ФУНКЦИЯ УВЕДОМЛЕНИЙ ===
    function showNotification(message, type) {
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.innerHTML = `
        <span>${message}</span>
        <button class="notification-close" onclick="this.parentElement.remove()">&times;</button>
      `;
      document.getElementById('notifications').appendChild(notification);

      // Автоматически удаляем уведомление через 5 секунд
      setTimeout(() => {
        if (notification.parentNode) { // Проверяем, не было ли уже удалено вручную
            notification.remove();
        }
      }, 5000);
    }

    // Привязываем кнопку
    document.getElementById('runAllBtn').addEventListener('click', runAllChecks);

    // Запускаем проверки при загрузке страницы (опционально)
    // window.addEventListener('DOMContentLoaded', runAllChecks);
  </script>
</body>
</html>
