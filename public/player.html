<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>SyncWatch Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #4a90e2;
      --secondary: #343a40;
      --accent-start: #4a90e2;
      --accent-end: #8e44ad;
      --bg-dark: #121212;
      --bg-darker: #0d0d0d;
      --text: #ffffff;
      --text-secondary: #cccccc;
      --border: #333333;
      --shadow: rgba(0, 0, 0, 0.5);
      --hover-bg: #1e1e1e;
      --progress-bg: #2c2c2c;
      --progress-fill: #4a90e2;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
      --info: #17a2b8;
      --drag-over: rgba(74, 144, 226, 0.2);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: var(--bg-dark);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.3s ease;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--bg-darker);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px var(--shadow);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    #leaveRoomBtn {
      padding: 0.5rem 1rem;
      background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s ease;
      font-size: 0.95rem;
    }
    #leaveRoomBtn:hover {
      opacity: 0.9;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .logo-container:hover {
      opacity: 0.8;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      position: relative;
    }
    .logo-svg {
      width: 80%;
      height: 80%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-svg svg {
      width: 100%;
      height: 100%;
    }
    .header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--primary);
    }
    .manage-links {
      display: flex;
      gap: 1rem;
    }
    .manage-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .manage-link:hover {
      background: rgba(74, 144, 226, 0.15);
      color: #fff;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 2rem;
      background: var(--bg-darker);
      border-bottom: 1px solid var(--border);
    }
    .status-line {
      font-size: 0.9rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .users-dropdown {
      position: relative;
      display: inline-block;
    }
    .users-toggle {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .users-toggle:hover {
      color: var(--primary);
    }
    .users-list-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      background: var(--bg-darker);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 4px 12px var(--shadow);
      z-index: 100;
      min-width: 200px;
      max-height: 300px;
      overflow-y: auto;
      display: none;
    }
    .users-list-dropdown.show {
      display: block;
    }
    .user-item-dropdown {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    .user-item-dropdown:last-child {
      border-bottom: none;
    }
    .user-name-dropdown {
      font-size: 0.9rem;
      color: var(--text);
    }
    .kick-btn-dropdown {
      background: var(--danger);
      color: white;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .kick-btn-dropdown:hover {
      background: #c82333;
    }
    #kickAllBtn {
      margin-top: 0.5rem;
      padding: 0.4rem;
      background: var(--danger);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      width: 100%;
    }
    #kickAllBtn:hover {
      background: #c82333;
    }
    .main-container {
      display: flex;
      flex-direction: row;
      gap: 1rem;
      padding: 1rem 2rem;
      min-height: calc(100vh - 180px);
    }
    .left-panel {
      flex: 2;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .video-status {
      padding: 0.5rem 1rem;
      background: var(--secondary);
      border-radius: 4px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-align: center;
    }
    .video-container {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: var(--secondary);
      box-shadow: 0 4px 12px var(--shadow);
      aspect-ratio: 16 / 9;
      max-height: 60vh;
    }
    #videoPlayer {
      width: 100%;
      height: 100%;
      background: #000;
      outline: none;
      object-fit: contain;
    }
    video::-webkit-media-controls {
      background: transparent;
    }
    video::-webkit-media-controls-panel {
      background: transparent;
    }
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-mute-button,
    video::-webkit-media-controls-volume-slider {
      filter: none;
      color: white;
    }
    .upload-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 1rem;
      background: var(--secondary);
      border-radius: 8px;
      box-shadow: 0 4px 12px var(--shadow);
    }
    #roomPasswordForm {
      margin-bottom: 0.5rem;
    }
    #roomPasswordInput {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg-darker);
      color: var(--text);
      border-radius: 4px;
      font-size: 0.95rem;
      autocomplete: current-password;
    }
    #uploadBtn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }
    #uploadBtn:hover {
      opacity: 0.9;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--progress-bg);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.5rem;
      display: none;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--progress-fill);
      width: 0%;
      transition: width 0.3s ease;
    }
    .right-panel {
      flex: 1;
      background: var(--secondary);
      border-radius: 8px;
      box-shadow: 0 4px 12px var(--shadow);
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .breadcrumb-panel {
      background: var(--bg-darker);
      padding: 0.6rem 1rem;
      border-radius: 6px;
      margin: 0.5rem 0;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .breadcrumb-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: var(--text-secondary);
    }
    .breadcrumb-item.active {
      color: var(--primary);
      font-weight: 600;
    }
    .breadcrumb-item i {
      font-size: 0.9em;
    }
    .breadcrumb-separator {
      color: var(--text-secondary);
      opacity: 0.7;
    }
    .explorer-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-darker);
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-top: 1rem;
    }
    .explorer-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 1rem;
        background: var(--secondary);
        border-bottom: 1px solid var(--border);
        font-weight: 500;
    }
    .explorer-actions {
        display: flex;
        gap: 0.5rem;
    }
    .explorer-actions button {
        padding: 0.25rem 0.5rem;
        background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: opacity 0.2s ease;
    }
    .explorer-actions button:hover {
      opacity: 0.9;
    }
    .explorer-actions button:disabled {
        background: var(--text-secondary);
        cursor: not-allowed;
    }
    #explorerList {
      flex-grow: 1;
      overflow-y: auto;
      padding: 0.75rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
      justify-items: center;
    }
    .explorer-item {
      width: 120px;
      height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      background: var(--bg-dark);
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      user-select: none;
      text-align: center;
      -webkit-user-drag: element;
    }
    .explorer-item:hover {
      background: var(--hover-bg);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px var(--shadow);
    }
    .explorer-item.drag-over {
        background: var(--drag-over);
        border: 1px dashed var(--primary);
    }
    .explorer-item i.folder-icon {
      font-size: 2rem;
      margin-bottom: 0.4rem;
      color: var(--warning);
    }
    .explorer-item i.file-icon {
      font-size: 2rem;
      margin-bottom: 0.4rem;
      color: var(--primary);
    }
    .explorer-item .item-name {
      font-size: 0.8rem;
      word-break: break-word;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .explorer-item.selected {
        border: 2px solid var(--primary) !important;
        background: var(--hover-bg);
    }
    .explorer-item .item-actions {
        position: absolute;
        top: 4px;
        right: 4px;
        display: none;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 3px;
    }
    .explorer-item:hover .item-actions {
        display: flex;
    }
    .explorer-item .item-actions button {
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        padding: 2px 4px;
        font-size: 0.7rem;
        transition: color 0.2s ease;
    }
    .explorer-item .item-actions button:hover {
        color: var(--danger);
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1001;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: var(--bg-darker);
      margin: auto;
      padding: 2rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 12px var(--shadow);
      width: 90%;
      max-width: 500px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--primary);
    }
    .close-modal {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .close-modal:hover {
      color: var(--text);
    }
    .modal-body {
      margin-bottom: 1.5rem;
    }
    .modal-body label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
    }
    .modal-body input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      background: var(--secondary);
      color: var(--text);
      border-radius: 4px;
      font-size: 1rem;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }
    .modal-footer button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }
    .btn-cancel {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-cancel:hover {
      background: var(--hover-bg);
    }
    .btn-create {
      background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
      color: white;
    }
    .btn-create:hover {
      opacity: 0.9;
    }
    .btn-create:disabled {
      background: var(--text-secondary);
      cursor: not-allowed;
    }
    #notifications {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      max-width: 300px;
    }
    .notification {
      padding: 1rem;
      margin-bottom: 0.5rem;
      background: var(--secondary);
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      box-shadow: 0 4px 12px var(--shadow);
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
      }
      .header, .controls {
        padding: 1rem;
      }
      .video-container {
        max-height: none;
        aspect-ratio: 16 / 9;
      }
      #explorerList {
        grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      }
      .explorer-item {
        width: 100px;
        height: 100px;
      }
      .users-list-dropdown {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 90%;
        max-height: 80vh;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <button id="leaveRoomBtn">Выйти из комнаты</button>
      <div class="logo-container" onclick="window.location.href='/select-room.html'">
        <div class="logo-icon">
          <div class="logo-svg">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#4a90e2" />
                  <stop offset="100%" stop-color="#8e44ad" />
                </linearGradient>
              </defs>
              <circle cx="50" cy="50" r="48" fill="url(#logoGradient)" />
              <text 
                x="50" 
                y="50" 
                font-family="Arial, sans-serif" 
                font-size="40" 
                fill="white" 
                text-anchor="middle" 
                dominant-baseline="middle"
                alignment-baseline="middle"
                style="paint-order: stroke; stroke: #000; stroke-width: 1px;"
              >
                S
              </text>
            </svg>
          </div>
        </div>
        <h1>SyncWatch</h1>
      </div>
    </div>
    <div class="manage-links">
      <a href="/select-room.html" class="manage-link">Select Room</a>
      <a href="/transcode.html" class="manage-link">Transcoder</a>
    </div>
  </div>
  <div class="controls">
    <div class="status-line">
      В сети: <span id="onlineCount">0</span>
      <div class="users-dropdown">
        <button class="users-toggle" id="usersToggle">
          <i class="fas fa-users"></i>
        </button>
        <div class="users-list-dropdown" id="usersDropdown"></div>
      </div>
    </div>
  </div>
  <div class="main-container">
    <div class="left-panel">
      <div class="video-status" id="status">Status: Not connected</div>
      <div class="video-container" id="videoDropZone">
        <video id="videoPlayer" width="100%" controls></video>
      </div>
      <div class="upload-section">
        <form id="roomPasswordForm">
          <input type="password" id="roomPasswordInput" autocomplete="current-password" placeholder="Пароль комнаты (если есть)">
        </form>
        <button id="uploadBtn"><i class="fas fa-upload"></i> Upload Video</button>
        <input type="file" id="uploadInput" accept="video/*" style="display:none;">
        <div class="progress-bar" style="display:none;">
          <div class="progress-bar-fill"></div>
        </div>
      </div>
    </div>
    <div class="right-panel">
      <div class="explorer-container">
        <div class="explorer-header">
          <span>File Explorer</span>
          <div class="explorer-actions">
            <button id="uploadBtnExplorer" title="Upload Video"><i class="fas fa-upload"></i></button>
            <button id="createFolderBtnExplorer" title="Create New Folder"><i class="fas fa-folder-plus"></i></button>
            <button id="refreshExplorerBtn" title="Refresh"><i class="fas fa-sync-alt"></i></button>
            <button id="moveItemsBtn" title="Move Selected" disabled><i class="fas fa-arrow-right"></i></button>
            <button id="deleteItemsBtn" title="Delete Selected" disabled><i class="fas fa-trash-alt"></i></button>
          </div>
        </div>
        <div class="breadcrumb-panel" id="explorerBreadcrumb"></div>
        <div id="explorerList"></div>
      </div>
    </div>
  </div>
  <div id="notifications"></div>
  <div id="createFolderModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Create New Folder</h2>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <label for="newFolderName">Folder Name:</label>
        <input type="text" id="newFolderName" placeholder="Enter folder name">
        <input type="hidden" id="currentModalPath" value="">
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="cancelCreateFolder">Cancel</button>
        <button class="btn-create" id="confirmCreateFolder">Create</button>
      </div>
    </div>
  </div>
  <input type="file" id="uploadInputExplorer" accept="video/*" style="display:none;">
  <script>
    // === ПРОВЕРКА АВТОРИЗАЦИИ ===
    (function checkAuth() {
      const token = localStorage.getItem('authToken');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }
    })();
    const socket = io();
    let joinedRoom = null;
    let currentVideoFile = null;
    let isVideoReady = false;
    let lastSeekSent = 0;
    let userName = null;
    let videoDuration = 0; // ← НОВОЕ: длительность видео
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');
    if (!roomId) {
        window.location.href = '/select-room.html';
    }
    let moveBuffer = null;

    // === ФОРМАТ ВРЕМЕНИ С ДЛИТЕЛЬНОСТЬЮ ===
    function formatStatusTimeWithDuration(current, duration) {
      const format = (seconds) => {
        if (isNaN(seconds) || seconds < 0) seconds = 0;
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        if (hrs > 0) {
          return `${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        } else {
          return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
      };
      return `${format(current)} / ${format(duration)}`;
    }

    // === ЛОКАЛЬНОЕ ОБНОВЛЕНИЕ ВРЕМЕНИ ===
    let localTimeUpdateInterval = null;
    function startLocalTimeUpdate(videoElement, videoPath) {
      if (localTimeUpdateInterval) clearInterval(localTimeUpdateInterval);
      localTimeUpdateInterval = setInterval(() => {
        if (!videoElement || videoElement.paused) return;
        const currentTime = videoElement.currentTime;
        const timeStr = formatStatusTimeWithDuration(currentTime, videoDuration);
        const videoName = videoPath ? videoPath.split('/').pop() : '—';
        document.getElementById('status').textContent = `Video: ${videoName} | Time: ${timeStr}`;
      }, 1000);
    }
    function stopLocalTimeUpdate() {
      if (localTimeUpdateInterval) {
        clearInterval(localTimeUpdateInterval);
        localTimeUpdateInterval = null;
      }
    }

    // === ОТПРАВКА СТАТУСА НА СЕРВЕР ===
    let videoStatusSyncInterval = null;
    function startVideoStatusSync(videoElement) {
      stopVideoStatusSync();
      videoStatusSyncInterval = setInterval(() => {
        if (!videoElement || !isVideoReady || videoElement.paused || !joinedRoom) return;
        socket.emit('video-status', {
          roomId: joinedRoom,
          currentTime: videoElement.currentTime,
          isPlaying: true,
          videoFile: currentVideoFile
        });
      }, 1000);
    }
    function stopVideoStatusSync() {
      if (videoStatusSyncInterval) {
        clearInterval(videoStatusSyncInterval);
        videoStatusSyncInterval = null;
      }
    }

    function parseJwt(token) {
      try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        console.warn('Failed to parse JWT token', e);
        return null;
      }
    }

    function joinRoom() {
      const token = localStorage.getItem('authToken');
      if (!token) {
        window.location.href = '/login.html';
        return;
      }
      const payload = parseJwt(token);
      const nameFromToken = payload?.name || payload?.username || payload?.sub;
      const name = nameFromToken || `User${Math.floor(Math.random() * 10000)}`;
      localStorage.setItem('userName', name);
      const password = sessionStorage.getItem('roomPassword') || 
                      (document.getElementById('roomPasswordInput')?.value.trim() || '');
      socket.emit('join-room', { roomId, name, password }, res => {
        if (!(res && res.success)) {
          if (res?.error === 'Invalid password') {
            sessionStorage.removeItem('roomPassword');
            const newPass = prompt('Неверный пароль. Введите правильный:');
            if (newPass !== null) {
              sessionStorage.setItem('roomPassword', newPass);
              joinRoom();
            } else {
              window.location.href = '/select-room.html';
            }
          } else {
            alert(res?.error || 'Ошибка входа в комнату');
            window.location.href = '/select-room.html';
          }
        } else {
          sessionStorage.removeItem('roomPassword');
          joinedRoom = roomId;
          userName = name;
        }
      });
    }

    function handleFileUpload(file) {
      stopLocalTimeUpdate();
      stopVideoStatusSync();
      const formData = new FormData();
      formData.append('video', file);
      const progressBar = document.querySelector('.progress-bar');
      progressBar.style.display = 'block';
      const progressBarFill = document.querySelector('.progress-bar-fill');
      const xhr = new XMLHttpRequest();
      xhr.upload.addEventListener('progress', (e) => {
        if (e.lengthComputable) {
          progressBarFill.style.width = `${(e.loaded / e.total) * 100}%`;
        }
      });
      xhr.addEventListener('load', () => {
        progressBar.style.display = 'none';
        progressBarFill.style.width = '0';
        if (xhr.status === 200) {
          const data = JSON.parse(xhr.responseText);
          if (data.success) {
            showNotification(`Video uploaded: ${data.file}`, 'success');
            video.src = `/videos/${data.file}`;
            const fileName = data.file.split('/').pop();
            videoDuration = 0;
            statusEl.innerHTML = `Video: ${fileName} | Time: 00:00 / ??`;
            currentVideoFile = data.file;
            isVideoReady = false;
            socket.emit('select-video', { roomId: joinedRoom, filename: data.file });
            video.addEventListener('loadedmetadata', () => {
              isVideoReady = true;
              videoDuration = video.duration;
              socket.emit('video-metadata', {
                roomId: joinedRoom,
                duration: videoDuration,
                filename: data.file
              });
            }, { once: true });
          } else {
            showNotification('Upload failed', 'error');
          }
        } else {
          showNotification('Upload failed', 'error');
        }
      });
      xhr.open('POST', '/upload');
      xhr.send(formData);

    // === File Explorer code unchanged ===
    let currentExplorerPath = '';

    async function navigateExplorerToFolder(folderPath) {
        currentExplorerPath = folderPath;
        updateExplorerBreadcrumb();
        await loadAndRenderExplorerForPath(folderPath);
    }
    function updateExplorerBreadcrumb() {
        const breadcrumb = document.getElementById('explorerBreadcrumb');
        breadcrumb.innerHTML = '';
        const parts = currentExplorerPath.split('/').filter(p => p);
        const items = [{ name: 'Home', path: '' }, ...parts.map((part, i) => ({
            name: part,
            path: parts.slice(0, i + 1).join('/')
        }))];
        items.forEach((item, index) => {
            const isLast = index === items.length - 1;
            const span = document.createElement('div');
            span.className = `breadcrumb-item ${isLast ? 'active' : ''}`;
            span.innerHTML = `${index === 0 ? '<i class="fas fa-home"></i>' : '<i class="fas fa-folder"></i>'} <span>${item.name}</span>`;
            if (!isLast) {
                span.style.cursor = 'pointer';
                span.addEventListener('click', () => navigateExplorerToFolder(item.path));
            }
            breadcrumb.appendChild(span);
            if (!isLast) {
                const sep = document.createElement('div');
                sep.className = 'breadcrumb-separator';
                sep.textContent = '/';
                breadcrumb.appendChild(sep);
            }
        });
    }
    async function loadAndRenderExplorerForPath(path) {
        const explorerList = document.getElementById('explorerList');
        explorerList.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 2rem; opacity: 0.7;">Loading...</div>';
        try {
            const token = localStorage.getItem('authToken');
            if (!token) throw new Error('Auth token missing');
            const structRes = await fetch('/api/files/list', { headers: { 'Authorization': `Bearer ${token}` } });
            const structData = await structRes.json();
            if (!structData.success) throw new Error(structData.error || 'Failed to load structure');
            const findContents = (items, targetPath) => {
                if (targetPath === '') return items;
                for (const item of items) {
                    if (item.type === 'folder' && item.path === targetPath) return item.children || [];
                    if (item.type === 'folder' && item.children) {
                        const found = findContents(item.children, targetPath);
                        if (found) return found;
                    }
                }
                return [];
            };
            const contentsAtPath = findContents(structData.structure, path);
            selectedItems.clear();
            updateExplorerActions();
            renderExplorerItems(contentsAtPath);
        } catch (err) {
            console.error('[EXPLORER] Error:', err);
            showNotification('Explorer failed: ' + err.message, 'error');
            explorerList.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 2rem; opacity: 0.7;">Error loading folder</div>';
        }
    }
    function highlightSelectedVideo(videoPath) {
        document.querySelectorAll('#explorerList .explorer-item').forEach(item => item.classList.remove('selected'));
        if (!videoPath) return;
        const el = document.querySelector(`#explorerList .explorer-item[data-path="${videoPath}"]`);
        if (el) el.classList.add('selected');
    }
    function updateExplorerSelection() {
        document.querySelectorAll('.explorer-item').forEach(el => {
            el.classList.toggle('selected', selectedItems.has(el.dataset.path));
        });
    }
    function updateExplorerActions() {
        const moveBtn = document.getElementById('moveItemsBtn');
        const deleteBtn = document.getElementById('deleteItemsBtn');
        const hasSelection = selectedItems.size > 0;
        moveBtn.disabled = !hasSelection;
        deleteBtn.disabled = !hasSelection;
    }
    function renderExplorerItems(contents) {
        const explorerList = document.getElementById('explorerList');
        explorerList.innerHTML = '';
        if (currentExplorerPath !== '') {
            const parentItem = document.createElement('div');
            parentItem.className = 'explorer-item';
            parentItem.dataset.path = '..';
            parentItem.dataset.type = 'folder';
            parentItem.draggable = false;
            parentItem.innerHTML = `<i class="fas fa-level-up-alt folder-icon"></i><div class="item-name">..</div>`;
            parentItem.addEventListener('click', (e) => {
                if (e.target.closest('.item-actions')) return;
                if (moveBuffer) {
                    moveBuffer = null;
                    const btn = document.getElementById('moveItemsBtn');
                    btn.innerHTML = '<i class="fas fa-arrow-right"></i>';
                    btn.title = 'Move Selected';
                }
                selectedItems.clear();
                selectedItems.add('..');
                updateExplorerSelection();
                updateExplorerActions();
            });
            parentItem.addEventListener('dblclick', (e) => {
                if (e.target.closest('.item-actions')) return;
                const parentPath = currentExplorerPath.split('/').slice(0, -1).join('/');
                navigateExplorerToFolder(parentPath);
            });
            parentItem.addEventListener('dragover', (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            });
            parentItem.addEventListener('dragenter', (e) => {
                e.preventDefault();
                if (draggedItem) {
                    parentItem.classList.add('drag-over');
                }
            });
            parentItem.addEventListener('dragleave', () => {
                parentItem.classList.remove('drag-over');
            });
            parentItem.addEventListener('drop', async (e) => {
                e.preventDefault();
                parentItem.classList.remove('drag-over');
                if (!draggedItem) return;
                const parentPath = currentExplorerPath.split('/').slice(0, -1).join('/');
                await moveItems([draggedItem], parentPath);
            });
            explorerList.appendChild(parentItem);
        }
        if (contents.length === 0) {
            explorerList.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 2rem; opacity: 0.7;"><i class="fas fa-info-circle"></i> Folder is empty</div>';
            return;
        }
        contents.forEach(item => {
            const div = document.createElement('div');
            div.className = 'explorer-item';
            div.dataset.path = item.path;
            div.dataset.type = item.type;
            div.draggable = true;
            if (item.type === 'folder') {
                div.innerHTML = `<i class="fas fa-folder folder-icon"></i><div class="item-name">${item.name}</div>`;
            } else {
                const fileName = item.name.split('/').pop();
                div.innerHTML = `<i class="fas fa-file-video file-icon"></i><div class="item-name">${fileName}</div>`;
            }
            div.addEventListener('dragstart', (e) => {
                draggedItem = item.path;
                e.dataTransfer.setData('text/plain', item.path);
                setTimeout(() => div.style.opacity = '0.4', 0);
            });
            div.addEventListener('dragend', () => {
                div.style.opacity = '1';
                draggedItem = null;
            });
            div.addEventListener('click', (e) => {
                if (e.target.closest('.item-actions')) return;
                if (moveBuffer) {
                    moveBuffer = null;
                    const btn = document.getElementById('moveItemsBtn');
                    btn.innerHTML = '<i class="fas fa-arrow-right"></i>';
                    btn.title = 'Move Selected';
                }
                const isCtrl = e.ctrlKey || e.metaKey;
                const path = item.path;
                if (isCtrl) {
                    selectedItems.has(path) ? selectedItems.delete(path) : selectedItems.add(path);
                } else {
                    selectedItems.clear();
                    selectedItems.add(path);
                }
                updateExplorerSelection();
                updateExplorerActions();
                if (item.type !== 'folder') {
                    highlightSelectedVideo(path);
                }
            });
            div.addEventListener('dblclick', (e) => {
                if (e.target.closest('.item-actions')) return;
                if (item.type === 'folder') {
                    navigateExplorerToFolder(item.path);
                } else {
                    const fileName = item.name.split('/').pop();
                    const ext = fileName.split('.').pop().toLowerCase();
                    const supportedFormats = ['mp4', 'webm', 'ogg'];
                    const isSupported = supportedFormats.includes(ext);
                    if (!isSupported) {
                      if (!confirm(`Формат видео "${fileName}" может не воспроизводиться в браузере. Продолжить?`)) {
                        return;
                      }
                    }
                    stopLocalTimeUpdate();
                    stopVideoStatusSync();
                    highlightSelectedVideo(item.path);
                    video.src = `/videos/${item.name}`;
                    videoDuration = 0;
                    const formattedTime = formatStatusTimeWithDuration(0, 0);
                    statusEl.innerHTML = `Video: ${fileName} | Time: ${formattedTime}`;
                    currentVideoFile = item.name;
                    isVideoReady = false;
                    socket.emit('select-video', { roomId: joinedRoom, filename: item.name });
                    video.addEventListener('loadedmetadata', () => {
                      isVideoReady = true;
                      videoDuration = video.duration;
                      socket.emit('video-metadata', {
                        roomId: joinedRoom,
                        duration: videoDuration,
                        filename: item.name
                      });
                    }, { once: true });
                }
            });
            if (item.type === 'folder') {
                div.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                });
                div.addEventListener('dragenter', (e) => {
                    e.preventDefault();
                    if (draggedItem && draggedItem !== item.path) {
                        div.classList.add('drag-over');
                    }
                });
                div.addEventListener('dragleave', () => {
                    div.classList.remove('drag-over');
                });
                div.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    div.classList.remove('drag-over');
                    if (!draggedItem || draggedItem === item.path) return;
                    await moveItems([draggedItem], item.path);
                });
            }
            explorerList.appendChild(div);
        });
        updateExplorerSelection();
    }
    async function moveItems(itemsToMove, targetPath) {
        if (!itemsToMove || itemsToMove.length === 0) {
            console.warn('[MOVE] No items to move');
            return false;
        }
        if (typeof targetPath !== 'string') {
            console.error('[MOVE] Invalid targetPath:', targetPath);
            showNotification('Invalid target path', 'error');
            return false;
        }
        const token = localStorage.getItem('authToken');
        if (!token) {
            console.error('[MOVE] No auth token found');
            showNotification('Authentication required. Please log in.', 'error');
            return false;
        }
        try {
            console.log('[MOVE] Sending request:', { items: itemsToMove, destination: targetPath });
            const response = await fetch('/api/files/move', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ items: itemsToMove, destination: targetPath })
            });
            const data = await response.json();
            console.log('[MOVE] Response:', response.status, data);
            if (response.ok && data.success) {
                showNotification(`Moved ${itemsToMove.length} item(s)`, 'success');
                loadAndRenderExplorerForPath(currentExplorerPath);
                selectedItems.clear();
                updateExplorerSelection();
                updateExplorerActions();
                return true;
            } else {
                const msg = data.error || data.message || 'Unknown error';
                console.error('[MOVE] Failed:', msg);
                showNotification('Move failed: ' + msg, 'error');
                return false;
            }
        } catch (error) {
            console.error('[MOVE] Network error:', error);
            showNotification('Move error: ' + error.message, 'error');
            return false;
        }
    }
    window.addEventListener('DOMContentLoaded', () => {
      const createFolderModal = document.getElementById('createFolderModal');
      const createFolderBtnExplorer = document.getElementById('createFolderBtnExplorer');
      const closeModalBtn = document.querySelector('.close-modal');
      const cancelCreateFolderBtn = document.getElementById('cancelCreateFolder');
      const confirmCreateFolderBtn = document.getElementById('confirmCreateFolder');
      const newFolderNameInput = document.getElementById('newFolderName');
      const currentModalPathInput = document.getElementById('currentModalPath');
      const uploadBtnExplorer = document.getElementById('uploadBtnExplorer');
      const uploadInputExplorer = document.getElementById('uploadInputExplorer');
      createFolderBtnExplorer.addEventListener('click', () => {
        currentModalPathInput.value = currentExplorerPath;
        newFolderNameInput.value = '';
        createFolderModal.style.display = 'flex';
        newFolderNameInput.focus();
      });
      closeModalBtn.addEventListener('click', () => {
        createFolderModal.style.display = 'none';
      });
      cancelCreateFolderBtn.addEventListener('click', () => {
        createFolderModal.style.display = 'none';
      });
      window.addEventListener('click', (event) => {
        if (event.target === createFolderModal) {
          createFolderModal.style.display = 'none';
        }
      });
      confirmCreateFolderBtn.addEventListener('click', async () => {
        const folderName = newFolderNameInput.value.trim();
        const basePath = currentModalPathInput.value;
        if (!folderName) {
          showNotification('Please enter a folder name', 'error');
          return;
        }
        if (/[<>:"/\\|?*\x00-\x1F]/.test(folderName)) {
          showNotification('Folder name contains invalid characters', 'error');
          return;
        }
        confirmCreateFolderBtn.disabled = true;
        confirmCreateFolderBtn.textContent = 'Creating...';
        try {
          const fullFolderPath = basePath ? `${basePath}/${folderName}` : folderName;
          const token = localStorage.getItem('authToken');
          if (!token) {
            throw new Error('Authentication required. Please log in.');
          }
          const response = await fetch('/api/files/create-folder', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ path: fullFolderPath })
          });
          const data = await response.json();
          if (response.ok && data.success) {
            showNotification(`Folder '${folderName}' created successfully`, 'success');
            createFolderModal.style.display = 'none';
            loadAndRenderExplorerForPath(currentExplorerPath);
          } else {
            const errorMessage = data.error || data.message || 'Failed to create folder';
            console.error('[CREATE FOLDER] Server error:', errorMessage);
            showNotification(`Error: ${errorMessage}`, 'error');
          }
        } catch (error) {
          console.error('[CREATE FOLDER] Network or other error:', error);
          showNotification(`Error creating folder: ${error.message}`, 'error');
        } finally {
          confirmCreateFolderBtn.disabled = false;
          confirmCreateFolderBtn.textContent = 'Create';
        }
      });
      uploadBtnExplorer.addEventListener('click', () => {
        uploadInputExplorer.click();
      });
      uploadInputExplorer.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) handleFileUpload(file);
      });
      document.getElementById('refreshExplorerBtn').addEventListener('click', () => {
        loadAndRenderExplorerForPath(currentExplorerPath);
      });
      document.getElementById('moveItemsBtn').addEventListener('click', async () => {
        const moveItemsBtn = document.getElementById('moveItemsBtn');
        if (moveBuffer) {
          await moveItems(moveBuffer, currentExplorerPath);
          moveBuffer = null;
          moveItemsBtn.innerHTML = '<i class="fas fa-arrow-right"></i>';
          moveItemsBtn.title = 'Move Selected';
          selectedItems.clear();
          updateExplorerSelection();
          updateExplorerActions();
        } else {
          if (selectedItems.size === 0) {
            showNotification('No items selected', 'info');
            return;
          }
          moveBuffer = Array.from(selectedItems);
          moveItemsBtn.innerHTML = '<i class="fas fa-arrow-down"></i> Move Here';
          moveItemsBtn.title = 'Click to move selected items here';
          selectedItems.clear();
          updateExplorerSelection();
          updateExplorerActions();
          showNotification('Selected items will be moved. Navigate to target folder and click "Move Here".', 'info');
        }
      });
      document.getElementById('deleteItemsBtn').addEventListener('click', async () => {
        if (selectedItems.size === 0) return;
        const itemsToDelete = Array.from(selectedItems);
        const itemCount = itemsToDelete.length;
        const itemNames = itemsToDelete.map(p => p.split('/').pop()).join(', ');
        if (!confirm(`Are you sure you want to delete ${itemCount} item(s)?
${itemNames}`)) {
          return;
        }
        let successCount = 0;
        let failCount = 0;
        for (const itemPath of itemsToDelete) {
          try {
            const token = localStorage.getItem('authToken');
            if (!token) throw new Error('Not authenticated');
            const response = await fetch('/api/files/delete', {
              method: 'DELETE',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify({ path: itemPath })
            });
            const data = await response.json();
            if (response.ok && data.success) {
              successCount++;
            } else {
              failCount++;
            }
          } catch (err) {
            failCount++;
          }
        }
        if (failCount === 0) {
          showNotification(`Successfully deleted ${successCount} item(s)`, 'success');
        } else {
          showNotification(`Deleted ${successCount} item(s). Failed to delete ${failCount} item(s).`, 'warning');
        }
        selectedItems.clear();
        updateExplorerSelection();
        updateExplorerActions();
        loadAndRenderExplorerForPath(currentExplorerPath);
      });
    });
  </script>
</body>
</html>
