<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>SyncWatch Player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Подключаем Socket.IO для синхронизации -->
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #4a90e2;
      --secondary: #343a40;
      --accent: #007bff;
      --bg-dark: #121212;
      --bg-darker: #0d0d0d;
      --text: #ffffff;
      --text-secondary: #cccccc;
      --border: #333333;
      --shadow: rgba(0, 0, 0, 0.5);
      --hover-bg: #1e1e1e;
      --progress-bg: #2c2c2c;
      --progress-fill: #007bff;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
      --info: #17a2b8;
      --drag-over: rgba(74, 144, 226, 0.2);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: var(--bg-dark);
      color: var(--text);
      line-height: 1.6;
      transition: background 0.3s ease;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--bg-darker);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px var(--shadow);
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .logo-container:hover {
      opacity: 0.8;
    }
    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a90e2, #8e44ad);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      position: relative;
    }
    .logo-svg {
      width: 80%;
      height: 80%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-svg svg {
      width: 100%;
      height: 100%;
    }
    .header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--primary);
    }
    .manage-links {
      display: flex;
      gap: 1rem;
    }
    .manage-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .manage-link:hover {
      background: rgba(0, 123, 255, 0.1);
      color: #fff;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 2rem;
      background: var(--bg-darker);
      border-bottom: 1px solid var(--border);
    }
    .status-line {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .main-container {
      display: flex;
      flex-direction: row; /* Изменено на row для горизонтального расположения */
      gap: 1rem;
      padding: 1rem 2rem;
      min-height: calc(100vh - 180px);
    }
    .left-panel {
      flex: 2;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      /* Перемещаем сюда список пользователей */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .users-section {
      background: var(--secondary);
      border-radius: 8px;
      box-shadow: 0 4px 12px var(--shadow);
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .users-section h3 {
      margin-bottom: 1rem;
      font-size: 1.2rem;
      color: var(--primary);
    }
    #usersList {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem;
      background: var(--bg-darker);
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .user-name {
      font-size: 0.9rem;
      color: var(--text);
    }
    .kick-btn {
      background: #dc3545;
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .kick-btn:hover {
      background: #c82333;
    }
    .video-container {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: var(--secondary);
      box-shadow: 0 4px 12px var(--shadow);
      aspect-ratio: 16 / 9;
    }
    #videoPlayer {
      width: 100%;
      height: 100%;
      background: #000;
      outline: none;
      object-fit: contain;
    }
    video::-webkit-media-controls {
      background: transparent;
    }
    video::-webkit-media-controls-panel {
      background: transparent;
    }
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-mute-button,
    video::-webkit-media-controls-volume-slider {
      filter: none;
      color: white;
    }
    .quality-menu {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
    }
    .quality-btn-player {
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }
    .quality-btn-player:hover {
      background: rgba(0, 0, 0, 0.8);
    }
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: var(--bg-darker);
      border: 1px solid var(--border);
      border-radius: 4px;
      box-shadow: 0 4px 12px var(--shadow);
      min-width: 120px;
      z-index: 100;
    }
    .dropdown-content.show {
      display: block;
    }
    .dropdown-content a {
      display: block;
      padding: 0.75rem 1rem;
      color: var(--text);
      text-decoration: none;
      transition: background 0.2s ease;
    }
    .dropdown-content a:hover {
      background: var(--hover-bg);
    }
    .upload-section {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 1rem;
      background: var(--secondary);
      border-radius: 8px;
      box-shadow: 0 4px 12px var(--shadow);
    }
    #uploadBtn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s ease;
    }
    #uploadBtn:hover {
      background: #0056b3;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--progress-bg);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.5rem;
      display: none;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--progress-fill);
      width: 0%;
      transition: width 0.3s ease;
    }
    #status {
      padding: 0.75rem;
      background: var(--secondary);
      border-radius: 4px;
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-align: center;
    }
    #leaveRoomBtn {
      padding: 0.5rem 1rem;
      background: #dc3545;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s ease;
      margin-bottom: 1rem;
    }
    #leaveRoomBtn:hover {
      background: #c82333;
    }
    /* Стиль для хлебных крошек */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .breadcrumb span {
      cursor: pointer;
      color: var(--accent);
    }
    .breadcrumb span:hover {
      text-decoration: underline;
    }
    .breadcrumb .separator {
      color: var(--text-secondary);
      cursor: default;
    }
    /* Стиль для проводника файлов */
    .explorer-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-darker);
      border-radius: 4px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-top: 1rem;
    }
    .explorer-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.5rem 1rem;
        background: var(--secondary);
        border-bottom: 1px solid var(--border);
        font-weight: 500;
    }
    .explorer-actions {
        display: flex;
        gap: 0.5rem;
    }
    .explorer-actions button {
        padding: 0.25rem 0.5rem;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 0.8rem;
        transition: background 0.2s ease;
    }
    .explorer-actions button:hover {
      background: #0056b3;
    }
    .explorer-actions button:disabled {
        background: var(--text-secondary);
        cursor: not-allowed;
    }
    #explorerList {
      flex-grow: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 0.75rem;
    }
    .explorer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 0.5rem;
      background: var(--bg-dark);
      border-radius: 4px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative; /* Для drag handle и контекстного меню */
      user-select: none; /* Предотвращает выделение текста при перетаскивании */
    }
    .explorer-item:hover {
      background: var(--hover-bg);
      transform: translateY(-2px);
      box-shadow: 0 4px 8px var(--shadow);
    }
    .explorer-item.drag-over {
        background: var(--drag-over);
        border: 1px dashed var(--primary);
    }
    .explorer-item i.folder-icon {
      font-size: 2.5rem;
      margin-bottom: 0.4rem;
      color: var(--warning);
    }
    .explorer-item i.file-icon {
      font-size: 2.5rem;
      margin-bottom: 0.4rem;
      color: var(--primary);
    }
    .explorer-item .item-name {
      font-size: 0.8rem;
      text-align: center;
      word-break: break-word;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }
    .explorer-item.selected {
        border: 2px solid var(--primary) !important; /* Приоритет для перезаписи hover */
        background: var(--hover-bg);
    }
    .explorer-item .item-actions {
        position: absolute;
        top: 2px;
        right: 2px;
        display: none; /* Скрываем по умолчанию */
        background: rgba(0, 0, 0, 0.5);
        border-radius: 3px;
    }
    .explorer-item:hover .item-actions {
        display: flex; /* Показываем при наведении */
    }
    .explorer-item .item-actions button {
        background: none;
        border: none;
        color: white;
        cursor: pointer;
        padding: 2px 4px;
        font-size: 0.7rem;
        transition: color 0.2s ease;
    }
    .explorer-item .item-actions button:hover {
        color: var(--danger);
    }
    /* Стили для модального окна создания папки */
    .modal {
      display: none;
      position: fixed;
      z-index: 1001;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background-color: var(--bg-darker);
      margin: auto;
      padding: 2rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 4px 12px var(--shadow);
      width: 90%;
      max-width: 500px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--primary);
    }
    .close-modal {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .close-modal:hover {
      color: var(--text);
    }
    .modal-body {
      margin-bottom: 1.5rem;
    }
    .modal-body label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--text-secondary);
    }
    .modal-body input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      background: var(--secondary);
      color: var(--text);
      border-radius: 4px;
      font-size: 1rem;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }
    .modal-footer button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s ease;
    }
    .btn-cancel {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-cancel:hover {
      background: var(--hover-bg);
    }
    .btn-create {
      background: var(--accent);
      color: white;
    }
    .btn-create:hover {
      background: #0056b3;
    }
    .btn-create:disabled {
      background: var(--text-secondary);
      cursor: not-allowed;
    }
    .right-panel {
      flex: 1;
      background: var(--secondary);
      border-radius: 8px;
      box-shadow: 0 4px 12px var(--shadow);
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    #notifications {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      max-width: 300px;
    }
    .notification {
      padding: 1rem;
      margin-bottom: 0.5rem;
      background: var(--secondary);
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      box-shadow: 0 4px 12px var(--shadow);
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
    @media (max-width: 768px) {
      .main-container {
        flex-direction: column; /* На мобильных устройствах снова вертикально */
      }
      .header, .controls {
        padding: 1rem;
      }
      .video-container {
        aspect-ratio: 16 / 9;
      }
      .quality-menu {
        top: 5px;
        right: 5px;
      }
      .upload-section {
        padding: 0.75rem;
      }
      .comments-section {
        padding: 0.75rem;
      }
      .right-panel {
        padding: 0.75rem;
      }
      .manage-links {
        flex-direction: column;
        gap: 0.5rem;
      }
      .top-panel {
          flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container" onclick="window.location.href='/select-room.html'">
      <div class="logo-icon">
        <div class="logo-svg">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4a90e2" />
                <stop offset="100%" stop-color="#8e44ad" />
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="48" fill="url(#logoGradient)" />
            <text 
              x="50" 
              y="50" 
              font-family="Arial, sans-serif" 
              font-size="40" 
              fill="white" 
              text-anchor="middle" 
              dominant-baseline="middle"
              alignment-baseline="middle"
              style="paint-order: stroke; stroke: #000; stroke-width: 1px;"
            >
              S
            </text>
          </svg>
        </div>
      </div>
      <h1>SyncWatch</h1>
    </div>
    <div class="manage-links">
      <a href="/select-room.html" class="manage-link">Select Room</a>
      <a href="/transcode" class="manage-link">Transcoder</a>
    </div>
  </div>
  <div class="controls">
    <div class="status-line">
      В сети: <span id="onlineCount">0</span>
    </div>
  </div>
  <div class="main-container">
    <div class="left-panel">
      <button id="leaveRoomBtn">Выйти из комнаты</button>
      <!-- Список пользователей -->
      <div class="users-section">
        <h3>Users Online</h3>
        <div id="usersList"></div>
      </div>
      <div class="video-container">
        <video id="videoPlayer" width="100%" controls></video>
        <div class="quality-menu">
          <button id="qualityBtn" class="quality-btn-player">Settings</button>
          <div id="qualityDropdown" class="dropdown-content">
            <a href="#" data-quality="original">Original</a>
            <a href="#" data-quality="low">Low (240p)</a>
            <a href="#" data-quality="medium">Medium (720p)</a>
          </div>
        </div>
      </div>
      <div class="upload-section">
        <button id="uploadBtn"><i class="fas fa-upload"></i> Upload Video</button>
        <input type="file" id="uploadInput" accept="video/*" style="display:none;">
        <div class="progress-bar" style="display:none;">
          <div class="progress-bar-fill"></div>
        </div>
      </div>
      <div id="status">Status: Not connected</div>
    </div>
    <div class="right-panel">
      <!-- НОВОЕ: Проводник файлов справа -->
      <div class="explorer-container">
          <div class="explorer-header">
              <span>File Explorer</span>
              <div class="explorer-actions">
                  <button id="uploadBtnExplorer" title="Upload Video"><i class="fas fa-upload"></i></button>
                  <button id="createFolderBtnExplorer" title="Create New Folder"><i class="fas fa-folder-plus"></i></button>
                  <button id="refreshExplorerBtn" title="Refresh"><i class="fas fa-sync-alt"></i></button>
                  <!-- Кнопки перемещения и удаления появятся при выборе -->
                  <button id="moveItemsBtn" title="Move Selected" disabled><i class="fas fa-arrow-right"></i></button>
                  <button id="deleteItemsBtn" title="Delete Selected" disabled><i class="fas fa-trash-alt"></i></button>
              </div>
          </div>
           <!-- Хлебные крошки для навигации по папкам в проводнике -->
           <div class="breadcrumb" id="explorerBreadcrumb">
              <!-- Хлебные крошки будут здесь -->
           </div>
          <div id="explorerList"></div>
      </div>
    </div>
  </div>
  <div id="notifications"></div>
  <!-- НОВОЕ: Модальное окно создания папки -->
  <div id="createFolderModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Create New Folder</h2>
        <button class="close-modal">&times;</button>
      </div>
      <div class="modal-body">
        <label for="newFolderName">Folder Name:</label>
        <input type="text" id="newFolderName" placeholder="Enter folder name">
        <input type="hidden" id="currentModalPath" value=""> <!-- Для передачи текущего пути -->
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="cancelCreateFolder">Cancel</button>
        <button class="btn-create" id="confirmCreateFolder">Create</button>
      </div>
    </div>
  </div>
  <!-- Скрытый input для загрузки файлов через проводник -->
  <input type="file" id="uploadInputExplorer" accept="video/*" style="display:none;">
  <script>
    // === SOCKET CONNECTION ===
    const socket = io();
    let joinedRoom = null;
    let currentVideoFile = null;
    let isVideoReady = false;
    let lastSeekSent = 0;
    let userName = localStorage.getItem('userName') || `User${Math.floor(Math.random()*10000)}`;
    // === URL PARAMS ===
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');
    // === ПРОВЕРКА ROOM ID ===
    if (!roomId) {
        window.location.href = '/select-room.html';
    }
    // === ROOM JOIN LOGIC ===
    function joinRoom() {
      const name = localStorage.getItem('userName') || '';
      socket.emit('join-room', { roomId, name }, res => {
        if (!(res && res.success)) {
          alert(res && res.error ? res.error : 'Ошибка входа в комнату');
          window.location.href = '/select-room.html';
        } else {
          joinedRoom = roomId;
          userName = res.room.name;
          updateExplorerBreadcrumb();
          loadAndRenderExplorerForPath('');
        }
      });
    }
    // === DOM LOADED ===
    window.addEventListener('DOMContentLoaded', () => {
      if (!roomId) {
          window.location.href = '/select-room.html';
          return;
      }
      if (roomId) {
        localStorage.setItem('lastRoomId', roomId);
      }
      joinRoom();
    });
    // === ELEMENTS ===
    const video = document.getElementById('videoPlayer');
    const statusEl = document.getElementById('status');
    const qualityBtn = document.getElementById('qualityBtn');
    const qualityDropdown = document.getElementById('qualityDropdown');
    const leaveRoomBtn = document.getElementById('leaveRoomBtn');
    const usersList = document.getElementById('usersList');
    const explorerBreadcrumb = document.getElementById('explorerBreadcrumb');
    // === QUALITY MENU ===
    qualityBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      qualityDropdown.classList.toggle('show');
    });
    document.addEventListener('click', (e) => {
      if (!qualityBtn.contains(e.target) && !qualityDropdown.contains(e.target)) {
        qualityDropdown.classList.remove('show');
      }
    });
    qualityDropdown.querySelectorAll('a').forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault();
        const quality = item.dataset.quality;
        if (!currentVideoFile) return;
        if (quality === 'original') {
          socket.emit('select-video', { roomId: joinedRoom, filename: currentVideoFile });
          qualityDropdown.classList.remove('show');
          return;
        }
        fetch(`/api/check-quality/${currentVideoFile}/${quality}`)
          .then(res => res.json())
          .then(data => {
            if (data.exists) {
              socket.emit('select-video', { roomId: joinedRoom, filename: data.filename });

    // === UPLOAD VIDEO ===
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadInput = document.getElementById('uploadInput');
    uploadBtn.addEventListener('click', () => {
      uploadInput.click();
    });
    uploadInput.addEventListener('change', (e) => {

        const progressBarFill = document.querySelector('.progress-bar-fill');

        xhr.upload.addEventListener('progress', (e) => {

            progressBarFill.style.width = `${percentComplete}%`;

              progressBar.style.display = 'none';

              progressBar.style.display = 'none';
            }
          } else {
            showNotification('Upload failed', 'error');
            progressBar.style.display = 'none';
          }
        });
        xhr.open('POST', '/upload');
        xhr.send(formData);
      }
    });
    // === LEAVE ROOM ===
    leaveRoomBtn.addEventListener('click', () => {
      socket.emit('leave-room', { roomId: joinedRoom }, () => {
        window.location.href = '/select-room.html';
      });
    });
    // === VIDEO EVENTS ===
    video.addEventListener('loadedmetadata', () => {
      isVideoReady = true;
    });
    video.addEventListener('play', () => {
      if (isVideoReady) {
        socket.emit('video-command', { type: 'play', roomId: joinedRoom });
      }
    });
    video.addEventListener('pause', () => {
      if (isVideoReady) {
        socket.emit('video-command', { type: 'pause', roomId: joinedRoom });
      }
    });
    video.addEventListener('seeked', () => {
      if (isVideoReady) {
        const now = Date.now();
        if (now - lastSeekSent > 500) {
          socket.emit('video-command', { type: 'seek', time: video.currentTime, roomId: joinedRoom });
          lastSeekSent = now;
        }
      }
    });
    // === RECEIVE VIDEO COMMAND FROM OTHER USERS ===
    socket.on('video-command', (data) => {
      if (isVideoReady && video.readyState >= 1) {
        if (data.type === 'play') {
          if (video.paused) {
            const playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.then(() => {}).catch(error => {
                console.warn('Play command blocked by browser:', error);
              });
            }
          }
        } else if (data.type === 'pause') {
          if (!video.paused) {
            video.pause();
          }
        } else if (data.type === 'seek' && typeof data.time === 'number') {
          if (Math.abs(video.currentTime - data.time) > 0.5) {
            lastSeekSent = Date.now();
            video.currentTime = data.time;
            console.log(`SyncWatch: Received seek command to ${data.time}s`);
          }
        }
      }
    });
    // === PROGRESS BUFFER ===
    video.addEventListener('progress', () => {
      const buffered = video.buffered;
      if (buffered.length > 0) {
        const bufferedEnd = buffered.end(0);
        const duration = video.duration;
        const percent = (bufferedEnd / duration) * 100;
        let bufferBar = document.querySelector('.buffer-progress');
        if (!bufferBar) {
          bufferBar = document.createElement('div');
          bufferBar.className = 'buffer-progress';
          bufferBar.innerHTML = '<div class="buffer-progress-fill"></div>';
          video.parentNode.insertBefore(bufferBar, video.nextSibling);
        }
        bufferBar.querySelector('.buffer-progress-fill').style.width = `${percent}%`;
      }
    });
    // === NOTIFICATION FUNCTION ===
    function showNotification(message, type) {
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.textContent = message;
      document.getElementById('notifications').appendChild(notification);
      setTimeout(() => {
        notification.remove();
      }, 3000);
    }
    // === USER KICKED ===
    socket.on('kicked-from-room', (data) => {
      alert(data.message || 'You have been kicked from the room');
      window.location.href = '/select-room.html';
    });
    // === VIDEO UPDATED (синхронизация выбора) ===
    socket.on('video-updated', (filename) => {
      console.log(`SyncWatch: Video updated event received: ${filename}`);
      video.src = `/videos/${filename}`;
      statusEl.innerHTML = `Video loaded: ${filename.split('/').pop()}`;
      currentVideoFile = filename;
      isVideoReady = false;
      highlightSelectedVideo(filename); // <-- ВАЖНО: Вызываем highlightSelectedVideo
      // loadAndRenderExplorerForPath(currentExplorerPath); // Не вызываем здесь, чтобы не перезагружать проводник при смене видео
    });
    // === GLOBAL ROOM STATE ===
    let roomState = null;
    socket.on('room-state', (state) => {
      roomState = state;
      if (state.currentVideo) {
        if (currentVideoFile !== state.currentVideo) {
          video.src = `/videos/${state.currentVideo}`;
          statusEl.innerHTML = `Video loaded: ${state.currentVideo.split('/').pop()}`;
          currentVideoFile = state.currentVideo;
          isVideoReady = false;
          console.log(`[PLAYER] Video src changed to: ${state.currentVideo}`);
        } else {
          if (isVideoReady && video.readyState >= 1) {
             if (Math.abs(video.currentTime - state.currentTime) > 0.5) {
                 const now = Date.now();
                 if (now - lastSeekSent > 1000) {
                     video.currentTime = state.currentTime;
                     console.log(`SyncWatch: Syncing time to ${state.currentTime}s`);

             }
          }
        }
        highlightSelectedVideo(state.currentVideo); // <-- ВАЖНО: Вызываем highlightSelectedVideo
      }
      document.getElementById('onlineCount').textContent = Object.keys(state.users).length;
      renderUsersList(state.users); // <-- ИСПРАВЛЕНО: Передаем users из state
      // loadAndRenderExplorerForPath(currentExplorerPath); // Не вызываем здесь, чтобы не перезагружать проводник при обновлении состояния комнаты
    });
    // === USERS LIST ===
    function renderUsersList(users) { // <-- ИСПРАВЛЕНО: Принимаем users как аргумент
      if (!users) return; // <-- Добавлено условие на случай, если users не определен

    // ===========================================================================
    // === НОВОЕ: ЛОГИКА ПРОВОДНИКА ФАЙЛОВ (EXPLORER) ============================
    // ===========================================================================
    let currentExplorerPath = ''; // Текущий путь в проводнике
    let selectedItems = new Set(); // Множество выбранных элементов (пути)
    // === НАВИГАЦИЯ В ПРОВОДНИКЕ ===
    async function navigateExplorerToFolder(folderPath) {
        currentExplorerPath = folderPath;
        updateExplorerBreadcrumb();
        await loadAndRenderExplorerForPath(folderPath);
    }
    // === ОБНОВЛЕНИЕ ХЛЕБНЫХ КРОШЕК ПРОВОДНИКА ===
    function updateExplorerBreadcrumb() {
        explorerBreadcrumb.innerHTML = '';
        const homeSpan = document.createElement('span');
        homeSpan.style.cursor = 'pointer';
        homeSpan.style.color = 'var(--accent)';
        homeSpan.textContent = 'Home';
        homeSpan.addEventListener('click', () => navigateExplorerToFolder(''));
        explorerBreadcrumb.appendChild(homeSpan);
        if (currentExplorerPath === '') return;
        const parts = currentExplorerPath.split('/');
        let pathSoFar = '';
        parts.forEach((part, index) => {
          const separator = document.createElement('span');
          separator.className = 'separator';
          separator.textContent = ' / ';
          separator.style.margin = '0 0.25rem';
          explorerBreadcrumb.appendChild(separator);
          pathSoFar = pathSoFar ? pathSoFar + '/' + part : part;
          const partSpan = document.createElement('span');
          partSpan.style.cursor = 'pointer';
          partSpan.style.color = 'var(--accent)';
          partSpan.textContent = part;
          partSpan.addEventListener('click', () => navigateExplorerToFolder(pathSoFar));
          explorerBreadcrumb.appendChild(partSpan);
        });
    }
    // === ЗАГРУЗКА И ОТРИСОВКА СОДЕРЖИМОГО ПРОВОДНИКА ===
    async function loadAndRenderExplorerForPath(path) {
        console.log(`[EXPLORER] Запрашиваем содержимое папки: '${path}'`);
        const explorerList = document.getElementById('explorerList');
        explorerList.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 2rem; opacity: 0.7;">Loading...</div>';
        try {
            const token = localStorage.getItem('authToken');
            if (!token) {
                throw new Error('Authentication token not found. Please log in again.');
            }
            const structRes = await fetch('/api/files/list', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            const structData = await structRes.json();
            if (!structData.success) throw new Error(structData.error || 'Failed to load structure');
            const findContents = (items, targetPath) => {
                if (targetPath === '') return items;
                for (const item of items) {
                    if (item.type === 'folder' && item.path === targetPath) {
                        return item.children || [];
                    }
                    if (item.type === 'folder' && item.children) {
                        const found = findContents(item.children, targetPath);
                        if (found) return found;
                    }
                }
                return [];
            };
            const contentsAtPath = findContents(structData.structure, path);
            selectedItems.clear();
            updateExplorerActions();
            renderExplorerItems(contentsAtPath);
        } catch (err) {
            console.error('[EXPLORER] Ошибка загрузки содержимого папки:', err);
            showNotification('Explorer failed to load: ' + err.message, 'error');
            explorerList.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; padding: 2rem; opacity: 0.7;">Error loading folder contents</div>';
        }
    }
    // === ФУНКЦИЯ СИНХРОНИЗАЦИИ ВЫБОРА ВИДЕО (ОБНОВЛЁННАЯ) ===
    function highlightSelectedVideo(videoPath) {
        // Снимаем выделение со всех элементов в explorerList
        document.querySelectorAll('#explorerList .explorer-item').forEach(item => {
            item.classList.remove('selected');
        });
        if (!videoPath) return;
        // Находим элемент в explorerList по data-path и выделяем его
        const selectedItemInExplorer = document.querySelector(`#explorerList .explorer-item[data-path="${videoPath}"]`);
        if (selectedItemInExplorer) {
            selectedItemInExplorer.classList.add('selected');
        }
    }
    // === ОБНОВЛЕНИЕ ВИЗУАЛЬНОГО ВЫДЕЛЕНИЯ В ПРОВОДНИКЕ ===
    function updateExplorerSelection() {
        document.querySelectorAll('.explorer-item').forEach(el => {
            const itemPath = el.dataset.path;
            if (selectedItems.has(itemPath)) {
                el.classList.add('selected');
            } else {
                el.classList.remove('selected');
            }
        });
    }
    // === ОБНОВЛЕНИЕ СОСТОЯНИЯ КНОПОК ДЕЙСТВИЙ В ПРОВОДНИКЕ ===
    function updateExplorerActions() {
        const moveBtn = document.getElementById('moveItemsBtn');
        const deleteBtn = document.getElementById('deleteItemsBtn');
        const hasSelection = selectedItems.size > 0;
        moveBtn.disabled = !hasSelection;
        deleteBtn.disabled = !hasSelection;
    }
    // === ОТРИСОВКА ЭЛЕМЕНТОВ ПРОВОДНИКА ===
    function renderExplorerItems(contents) {
        const explorerList = document.getElementById('explorerList');
        explorerList.innerHTML = '';
        if (currentExplorerPath !== '') {
            const parentItem = document.createElement('div');
            parentItem.className = 'explorer-item';
            parentItem.dataset.path = '..';
            parentItem.dataset.type = 'folder';
            parentItem.draggable = false;
            parentItem.innerHTML = `
                <i class="fas fa-level-up-alt folder-icon"></i>
                <div class="item-name">..</div>
            `;
            parentItem.addEventListener('click', (e) => {
                 if (e.target.closest('.item-actions')) return;
                 selectedItems.clear();
                 selectedItems.add('..');
                 updateExplorerSelection();
                 updateExplorerActions();
                 const parentPath = currentExplorerPath.split('/').slice(0, -1).join('/');
                 navigateExplorerToFolder(parentPath);
            });
            parentItem.addEventListener('dblclick', (e) => {
                 if (e.target.closest('.item-actions')) return;
                 const parentPath = currentExplorerPath.split('/').slice(0, -1).join('/');
                 navigateExplorerToFolder(parentPath);
            });
            explorerList.appendChild(parentItem);
        }
        if (contents.length === 0) {
            const emptyDiv = document.createElement('div');
            emptyDiv.style.gridColumn = '1 / -1';
            emptyDiv.style.textAlign = 'center';
            emptyDiv.style.padding = '2rem';
            emptyDiv.style.opacity = '0.7';
            emptyDiv.innerHTML = '<i class="fas fa-info-circle"></i> Folder is empty';
            explorerList.appendChild(emptyDiv);
            return;
        }
        contents.forEach(item => {
            const div = document.createElement('div');
            div.className = 'explorer-item';
            div.dataset.path = item.path;
            div.dataset.type = item.type;
            div.draggable = true;
            if (item.type === 'folder') {
                div.innerHTML = `
                    <i class="fas fa-folder folder-icon"></i>
                    <div class="item-name">${item.name}</div>
                `;
            } else {
                const fileName = item.name.split('/').pop();
                const ext = fileName.split('.').pop().toLowerCase();
                let iconClass = 'fas fa-file-video';
                div.innerHTML = `
                    <i class="${iconClass} file-icon"></i>
                    <div class="item-name">${fileName}</div>
                `;
            }
            // === SINGLE CLICK для визуального выбора ===
            div.addEventListener('click', (e) => {
                if (e.target.closest('.item-actions')) return;
                const isCtrlClick = e.ctrlKey || e.metaKey;
                const isShiftClick = e.shiftKey;
                const itemPath = item.path;
                if (isCtrlClick) {
                    if (selectedItems.has(itemPath)) {
                        selectedItems.delete(itemPath);
                    } else {
                        selectedItems.add(itemPath);
                    }
                } else if (isShiftClick) {
                    if (selectedItems.has(itemPath)) {
                        selectedItems.delete(itemPath);
                    } else {
                        selectedItems.add(itemPath);
                    }
                } else {
                    selectedItems.clear();
                    selectedItems.add(itemPath);
                }
                updateExplorerSelection();
                updateExplorerActions();
                // === СИНХРОНИЗАЦИЯ ВЫБОРА ВИДЕО (только визуально) ===
                if (item.type !== 'folder') {
                    highlightSelectedVideo(item.path);
                }
                // === /СИНХРОНИЗАЦИЯ ВЫБОРА ВИДЕО ===
            });
            // === DOUBLE CLICK для открытия/воспроизведения ===
            div.addEventListener('dblclick', (e) => {
                 if (e.target.closest('.item-actions')) return;
                 if (item.type === 'folder') {
                     navigateExplorerToFolder(item.path);
                 } else {
                     const fileName = item.name.split('/').pop();
                     const ext = fileName.split('.').pop().toLowerCase();
                     const supportedFormats = ['mp4', 'webm', 'ogg'];
                     const isSupported = supportedFormats.includes(ext);
                     if (!isSupported) {
                       if (!confirm(`Формат видео "${fileName}" может не воспроизводиться в браузере. Продолжить?`)) {
                         return;
                       }
                     }
                     // === СИНХРОНИЗАЦИЯ ВЫБОРА ВИДЕО (перед воспроизведением) ===
                     highlightSelectedVideo(item.path);
                     video.src = `/videos/${item.name}`;
                     statusEl.innerHTML = `Video loaded: ${fileName}`;
                     currentVideoFile = item.name;
                     isVideoReady = false;
                     // ИСПРАВЛЕНО: Отправляем объект с roomId и filename
                     socket.emit('select-video', { roomId: joinedRoom, filename: item.name });
                     // === /СИНХРОНИЗАЦИЯ ВЫБОРА ВИДЕО ===
                 }
            });
            explorerList.appendChild(div);
        });
        updateExplorerSelection();
    }
    // --- НОВАЯ ФУНКЦИЯ: Перемещение элементов ---
    async function moveItems(itemsToMove, targetPath) {
        if (!itemsToMove || itemsToMove.length === 0) {
            console.warn('[EXPLORER] No items selected to move.');
            return false;
        }
        if (targetPath === undefined || targetPath === null || typeof targetPath !== 'string') {
            console.warn('[EXPLORER] Invalid or no target path specified for move operation:', targetPath);
            showNotification('Invalid target path for move operation.', 'error');
            return false;
        }
        console.log(`[EXPLORER] Attempting to move items to: "${targetPath}"`);
        console.log(`[EXPLORER] Items to move:`, itemsToMove);
        try {
            const token = localStorage.getItem('authToken');
            if (!token) {
                throw new Error('Authentication token not found. Please log in again.');
            }
            console.log(`[EXPLORER] Sending request to /api/files/move with body:`, {
                items: itemsToMove,
                destination: targetPath
            });
            const response = await fetch('/api/files/move', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    items: itemsToMove,
                    destination: targetPath
                })
            });
            console.log(`[EXPLORER] Server response status:`, response.status);
            const data = await response.json();
            console.log(`[EXPLORER] Server response body:`, data);
            if (response.ok && data.success) {
                showNotification(`Successfully moved ${itemsToMove.length} item(s).`, 'success');
                loadAndRenderExplorerForPath(currentExplorerPath);
                selectedItems.clear();
                updateExplorerSelection();
                updateExplorerActions();
                return true;
            } else {
                const errorMessage = data.error || data.message || 'Failed to move items';
                console.error('[EXPLORER] Move operation failed:', errorMessage);
                showNotification(`Error moving items: ${errorMessage}`, 'error');
                return false;
            }
        } catch (error) {
            console.error('[EXPLORER] Network error during move:', error);
            showNotification(`Error moving items: ${error.message}`, 'error');
            return false;
        }
    }
    // === ИНИЦИАЛИЗАЦИЯ ПРОВОДНИКА ПОСЛЕ ЗАГРУЗКИ DOM ===

                    },

                });

        uploadBtnExplorer.addEventListener('click', () => {

        uploadInputExplorer.addEventListener('change', (e) => {

            if (file) {
                const formData = new FormData();
                formData.append('video', file);
                const progressBar = document.querySelector('.progress-bar');
                progressBar.style.display = 'block';
                const progressBarFill = document.querySelector('.progress-bar-fill');
                const xhr = new XMLHttpRequest();
                xhr.upload.addEventListener('progress', (e) => {
                  if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    progressBarFill.style.width = `${percentComplete}%`;
                  }
                });
                xhr.addEventListener('load', () => {
                  if (xhr.status === 200) {
                    const data = JSON.parse(xhr.responseText);
                    if (data.success) {
                      showNotification(`Video uploaded: ${data.filename}`, 'success');
                      progressBar.style.display = 'none';
                      progressBarFill.style.width = '0';
                      loadAndRenderExplorerForPath(currentExplorerPath);
                    } else {
                      showNotification('Upload failed', 'error');
                      progressBar.style.display = 'none';
                    }
                  } else {
                    showNotification('Upload failed', 'error');
                    progressBar.style.display = 'none';
                  }
                });
                xhr.open('POST', '/upload');
                xhr.send(formData);
            }
        });
        document.getElementById('refreshExplorerBtn').addEventListener('click', () => {
            loadAndRenderExplorerForPath(currentExplorerPath);
        });
        document.getElementById('moveItemsBtn').addEventListener('click', async () => {
            if (selectedItems.size === 0) {
                console.warn('[EXPLORER] No items selected to move via button.');
                return;
            }
            const itemsToMove = Array.from(selectedItems);
            const targetPath = currentExplorerPath;
            console.log(`[EXPLORER] Button move clicked. Items:`, itemsToMove, "Target:", targetPath);
            let allInSameFolder = true;
            for (const itemPath of itemsToMove) {
                const parentPath = itemPath.split('/').slice(0, -1).join('/');
                if (parentPath !== targetPath) {
                    allInSameFolder = false;
                    break;
                }
            }
            if (allInSameFolder) {
                console.log('[EXPLORER] Items are already in the target folder.');
                showNotification('Items are already in this folder.', 'info');
                selectedItems.clear();
                updateExplorerSelection();
                updateExplorerActions();
                return;
            }
            await moveItems(itemsToMove, targetPath);
        });
        document.getElementById('deleteItemsBtn').addEventListener('click', async () => {
            if (selectedItems.size === 0) return;
            const itemsToDelete = Array.from(selectedItems);
            const itemCount = itemsToDelete.length;
            const itemNames = itemsToDelete.map(p => p.split('/').pop()).join(', ');
            if (!confirm(`Are you sure you want to delete ${itemCount} item(s)?
${itemNames}`)) {
                return;
            }
            let successCount = 0;
            let failCount = 0;
            for (const itemPath of itemsToDelete) {
                try {
                    const token = localStorage.getItem('authToken');
                    if (!token) throw new Error('Not authenticated');
                    const response = await fetch('/api/files/delete', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ path: itemPath })
                    });
                    const data = await response.json();
                    if (response.ok && data.success) {
                        successCount++;
                    } else {
                        failCount++;
                        console.error(`[DELETE] Failed to delete ${itemPath}:`, data.error || data.message);
                    }
                } catch (err) {
                    failCount++;
                    console.error(`[DELETE] Network error deleting ${itemPath}:`, err);
                }
            }
            if (failCount === 0) {
                showNotification(`Successfully deleted ${successCount} item(s)`, 'success');
            } else {
                showNotification(`Deleted ${successCount} item(s). Failed to delete ${failCount} item(s).`, 'warning');
            }
            selectedItems.clear();
            updateExplorerSelection();
            updateExplorerActions();
            loadAndRenderExplorerForPath(currentExplorerPath);
        });
    });
    // ===========================================================================
    // === КОНЕЦ ЛОГИКИ ПРОВОДНИКА ===============================================
    // ===========================================================================
  </script>
</body>
</html>
