<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcode Videos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --primary: #4a90e2;
      --secondary: #343a40;
      --accent: #007bff;
      --bg-dark: #121212;
      --bg-darker: #0d0d0d;
      --text: #ffffff;
      --text-secondary: #cccccc;
      --border: #333333;
      --shadow: rgba(0, 0, 0, 0.5);
      --hover-bg: #1e1e1e;
      --progress-bg: #2c2c2c;
      --progress-fill: #007bff;
      --success: #28a745;
      --warning: #ffc107;
      --danger: #dc3545;
      --info: #17a2b8;
      --cancelled: #6c757d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text);
      line-height: 1.6;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background: var(--bg-darker);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 10px var(--shadow);
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .logo-container:hover {
      opacity: 0.8;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4a90e2, #8e44ad);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }

    .logo-svg {
      width: 80%;
      height: 80%;
    }

    .logo-svg svg {
      width: 100%;
      height: 100%;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: var(--primary);
    }

    .admin-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      padding: 0.5rem 1rem;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .admin-link:hover {
      background: rgba(0, 123, 255, 0.1);
      color: #fff;
    }

    .main-container {
      display: flex;
      gap: 1rem;
      padding: 1rem 2rem;
      min-height: calc(100vh - 180px);
    }

    .left-panel {
      flex: 2;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel {
      background: var(--bg-darker);
      border-radius: 8px;
      box-shadow: 0 4px 12px var(--shadow);
      padding: 1rem;
    }

    .panel h2 {
      margin-bottom: 1rem;
      font-size: 1.3rem;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background: #0056b3;
    }

    .btn-sm {
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
    }

    .btn-danger {
      background: var(--danger);
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .template-item {
      padding: 1rem;
      background: var(--secondary);
      border-radius: 4px;
      border: 1px solid var(--border);
      margin-bottom: 0.5rem;
    }

    .template-system {
      border-left: 3px solid var(--info);
      background: rgba(23, 162, 184, 0.05);
    }

    .template-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .template-name {
      font-weight: 500;
      color: var(--text);
    }

    .template-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem;
      background: var(--secondary);
      border-radius: 4px;
      border: 1px solid var(--border);
      margin-bottom: 0.5rem;
      transition: background 0.2s ease;
    }

    .file-item:hover {
      background: var(--hover-bg);
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      min-width: 0;
    }

    .file-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .file-name {
      font-size: 0.9rem;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 0.7rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }

    .unsupported-warning {
      color: var(--warning);
      font-size: 0.7rem;
      font-weight: 500;
      margin-top: 0.25rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .quick-transcode-btn {
      background: var(--accent);
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .quick-transcode-btn:hover {
      background: #0056b3;
    }

    .queue-item {
      padding: 0.75rem;
      background: var(--secondary);
      border-radius: 4px;
      border: 1px solid var(--border);
      margin-bottom: 0.5rem;
    }

    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .queue-file {
      font-weight: 500;
      color: var(--text);
    }

    .queue-template {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--progress-bg);
      border-radius: 3px;
      overflow: hidden;
      margin: 0.5rem 0;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--progress-fill);
      width: 0%;
      transition: width 0.3s ease;
    }

    .status-badge {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .status-pending { background: var(--warning); color: #000; }
    .status-processing { background: var(--accent); color: white; }
    .status-completed { background: var(--success); color: white; }
    .status-error { background: var(--danger); color: white; }
    .status-cancelled { background: var(--cancelled); color: white; }

    #notifications {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1000;
      max-width: 300px;
    }

    .notification {
      padding: 1rem;
      margin-bottom: 0.5rem;
      background: var(--secondary);
      border-left: 4px solid var(--accent);
      border-radius: 4px;
      box-shadow: 0 4px 12px var(--shadow);
      animation: slideIn 0.3s ease-out;
    }

    .notification.fade-out {
      animation: slideOut 0.3s forwards;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes slideOut {
      from { transform: translateX(0); opacity: 1; }
      to { transform: translateX(100%); opacity: 0; }
    }

    @media (max-width: 768px) {
      .main-container {
        flex-direction: column;
        padding: 1rem;
      }

      .header {
        padding: 1rem;
      }

      .queue-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .file-info {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.25rem;
      }

      .panel h2 {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container" onclick="window.location.href='/select-room.html'">
      <div class="logo-icon">
        <div class="logo-svg">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#4a90e2" />
                <stop offset="100%" stop-color="#8e44ad" />
              </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="48" fill="url(#logoGradient)" />
            <text x="50" y="50" font-family="Arial, sans-serif" font-size="40" fill="white"
                  text-anchor="middle" dominant-baseline="middle">S</text>
          </svg>
        </div>
      </div>
      <h1>SyncWatch</h1>
    </div>
    <a href="/admin" class="admin-link">Admin Console</a>
  </div>

  <div class="main-container">
    <div class="left-panel">
      <div class="panel">
        <h2>
          Conversion Templates
          <button class="btn" id="addTemplateBtn" title="Add new conversion template">
            <i class="fas fa-plus"></i> Add Template
          </button>
        </h2>
        <div id="templatesList"></div>
      </div>

      <div class="panel">
        <h2>
          Select Files to Convert
          <button class="btn btn-sm" id="refreshFilesBtn" title="Refresh file list">
            <i class="fas fa-sync"></i>
          </button>
        </h2>
        <div id="filesList"></div>
      </div>
    </div>

    <div class="right-panel">
      <div class="panel">
        <h2>Conversion Queue</h2>
        <div id="queueList"></div>
      </div>

      <div class="panel">
        <h2>Progress</h2>
        <div id="progressSection">Queue updates every 2 seconds</div>
      </div>
    </div>
  </div>

  <div id="notifications"></div>

  <!-- Подключаем логику -->
  <script src="/js/api.js"></script>
</body>
</html>
