<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>SyncWatch — Select Room</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #4a90e2;
      --secondary: #343a40;
      --accent-start: #4a90e2;
      --accent-end: #8e44ad;
      --bg-dark: #121212;
      --bg-darker: #0d0d0d;
      --text: #ffffff;
      --text-secondary: #cccccc;
      --border: #333333;
      --shadow: rgba(0, 0, 0, 0.5);
      --hover-bg: #1e1e1e;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: var(--bg-dark);
      color: var(--text);
      padding: 2rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .header h1 {
      font-size: 2rem;
      color: var(--primary);
    }
    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .btn {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
      color: white;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--hover-bg);
    }
    .btn-logout {
      background: #e74c3c;
      color: white;
      border: none;
    }
    .btn-logout:hover {
      opacity: 0.9;
    }
    .room-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }
    .room-card {
      background: var(--secondary);
      border-radius: 8px;
      padding: 1.2rem;
      box-shadow: 0 4px 12px var(--shadow);
      transition: transform 0.2s ease;
      position: relative;
    }
    .room-card:hover {
      transform: translateY(-4px);
    }
    .room-card h3 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: space-between;
    }
    .room-card h3 .room-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .room-card h3 i {
      color: var(--primary);
    }
    .delete-room-btn {
      background: none;
      border: none;
      color: #ff6b6b;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.25rem;
      border-radius: 4px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .delete-room-btn:hover {
      opacity: 1;
      background: rgba(255, 107, 107, 0.1);
    }
    .room-info {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin: 0.5rem 0;
    }
    .video-info {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin: 0.5rem 0;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }
    .room-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .join-btn {
      flex: 1;
      padding: 0.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .join-btn:hover {
      opacity: 0.9;
    }
    .password-input {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      border: 1px solid var(--border);
      background: var(--bg-darker);
      color: var(--text);
      border-radius: 4px;
      display: none;
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 1rem;
      background: var(--secondary);
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      box-shadow: 0 4px 12px var(--shadow);
      z-index: 1000;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }
    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">S</div>
      <h1>SyncWatch</h1>
    </div>
    <div class="controls" id="authControls"></div>
  </div>

  <button id="createRoomBtn" class="btn btn-primary">Создать новую комнату</button>
  <div class="room-list" id="roomList"></div>
  <div id="notifications"></div>

  <script>
    (function() {
      const token = localStorage.getItem('authToken');
      if (!token) {
        alert('Требуется авторизация');
        window.location.href = '/login.html';
        return;
      }
    })();

    const socket = io();
    let rooms = [];

    function getUserInfo() {
      const token = localStorage.getItem('authToken');
      if (!token) return null;
      try {
        const payload = token.split('.')[1];
        if (!payload) return null;
        const decoded = JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/')));
        return decoded;
      } catch (e) {
        console.warn('Не удалось распарсить токен:', e);
        return null;
      }
    }

    function getDisplayName() {
      const user = getUserInfo();
      return user?.username || 'User';
    }

    function updateAuthControls() {
      const controls = document.getElementById('authControls');
      const displayName = getDisplayName();
      controls.innerHTML = `
        <a href="/user-profile.html" class="btn btn-secondary">
          <i class="fas fa-user"></i> ${displayName}
        </a>
        <button id="logoutBtn" class="btn btn-logout">
          <i class="fas fa-sign-out-alt"></i> Выйти
        </button>
      `;
      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('authToken');
        showNotification('Вы вышли из системы', 'info');
        window.location.href = '/login.html';
      });
    }

    function showNotification(message, type = 'info') {
      const notif = document.createElement('div');
      notif.className = 'notification';
      notif.textContent = message;
      document.getElementById('notifications').appendChild(notif);
      setTimeout(() => notif.remove(), 3000);
    }

    function formatTime(seconds) {
      if (typeof seconds !== 'number' || isNaN(seconds) || seconds < 0) seconds = 0;
      const totalSecs = Math.floor(seconds);
      const mins = Math.floor(totalSecs / 60);
      const secs = totalSecs % 60;
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function formatTimeWithDuration(current, duration) {
      return `${formatTime(current)} / ${formatTime(duration)}`;
    }

    function renderRooms() {
      const roomList = document.getElementById('roomList');
      if (rooms.length === 0) {
        roomList.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-users"></i>
            <h3>Нет активных комнат</h3>
            <p>Создайте новую комнату, чтобы начать совместный просмотр</p>
          </div>
        `;
        return;
      }

      roomList.innerHTML = rooms.map(room => `
        <div class="room-card" data-id="${room.id}">
          <h3>
            <div class="room-title">
              ${room.name}
              ${room.hasPassword 
                ? '<i class="fas fa-lock" style="color: #8e44ad;" title="Защищена паролем"></i>' 
                : '<i class="fas fa-lock-open" title="Публичная"></i>'}
            </div>
            <button class="delete-room-btn" data-room-id="${room.id}" title="Удалить комнату">
              <i class="fas fa-trash"></i>
            </button>
          </h3>
          <div class="room-info">
            Пользователей: ${Object.keys(room.users || {}).length}
          </div>
          ${room.video ? `
            <div class="video-info">
              <strong>Видео:</strong> ${room.video.title || 'Без названия'}<br>
              <small>Текущее время: <span class="current-time">${formatTimeWithDuration(room.video.currentTime, room.video.duration)}</span></small><br>
              <small>Статус: ${room.video.isPlaying ? 'Играет' : 'Пауза'}</small>
            </div>
          ` : '<div class="video-info"><em>Видео не загружено</em></div>'}
          <input type="password" class="password-input" placeholder="Пароль комнаты" data-room-id="${room.id}">
          <div class="room-actions">
            <button class="join-btn" data-room-id="${room.id}">Войти</button>
          </div>
        </div>
      `).join('');

      document.querySelectorAll('.join-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const roomId = btn.dataset.roomId;
          const room = rooms.find(r => r.id === roomId);
          const passwordInput = document.querySelector(`.password-input[data-room-id="${roomId}"]`);
          let password = room?.hasPassword ? passwordInput.value.trim() : '';
          if (room?.hasPassword && !password) {
            showNotification('Введите пароль для этой комнаты', 'error');
            passwordInput.focus();
            return;
          }
          const displayName = getDisplayName();
          if (!displayName) {
            showNotification('Не удалось определить ваше имя', 'error');
            return;
          }
          sessionStorage.setItem('roomPassword', password);
          sessionStorage.setItem('userName', displayName);
          window.location.href = `/player.html?room=${roomId}`;
        });
      });

      document.querySelectorAll('.delete-room-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const roomId = btn.dataset.roomId;
          const room = rooms.find(r => r.id === roomId);
          if (!confirm(`Удалить комнату "${room.name}"?`)) return;
          socket.emit('delete-room', { roomId }, (res) => {
            if (res?.success) {
              showNotification(`Комната "${room.name}" удалена`, 'success');
              loadRooms();
            } else {
              showNotification('Ошибка: ' + (res?.message || 'неизвестно'), 'error');
            }
          });
        });
      });

      document.querySelectorAll('.password-input').forEach(input => {
        const room = rooms.find(r => r.id === input.dataset.roomId);
        if (room && room.hasPassword) input.style.display = 'block';
      });
    }

    function loadRooms() {
      socket.emit('get-rooms', (data) => {
        rooms = data || [];
        renderRooms();
      });
    }

    socket.on('room-update', (update) => {
      const room = rooms.find(r => r.id === update.roomId);
      if (!room) return;

      if (!room.video) room.video = {};
      room.video.currentTime = update.currentTime || 0;
      room.video.isPlaying = update.isPlaying !== undefined ? update.isPlaying : false;
      if (update.videoTitle !== undefined) {
        room.video.title = update.videoTitle;
      }
      if (update.duration !== undefined) {
        room.video.duration = update.duration;
      }

      const card = document.querySelector(`.room-card[data-id="${update.roomId}"]`);
      if (!card) return;

      const timeEl = card.querySelector('.current-time');
      const statusEl = card.querySelector('.video-info small:nth-of-type(2)');

      if (timeEl) {
        const dur = room.video.duration || 0;
        timeEl.textContent = formatTimeWithDuration(update.currentTime || 0, dur);
      }
      if (statusEl) {
        statusEl.textContent = `Статус: ${update.isPlaying ? 'Играет' : 'Пауза'}`;
      }

      if (update.videoTitle !== undefined) {
        const videoTitleEl = card.querySelector('.video-info strong');
        if (videoTitleEl) {
          videoTitleEl.textContent = `Видео: ${update.videoTitle || 'Без названия'}`;
        }
      }
    });

    document.getElementById('createRoomBtn').addEventListener('click', () => {
      const name = prompt('Название комнаты:');
      if (!name?.trim()) return showNotification('Название обязательно', 'error');
      const isProtected = confirm('Сделать приватной?');
      let password = isProtected ? prompt('Пароль:')?.trim() : null;
      if (isProtected && !password) return showNotification('Пароль обязателен', 'error');

      socket.emit('create-room', { name: name.trim(), password }, (res) => {
        if (res.success) {
          if (password) sessionStorage.setItem('roomPassword', password);
          window.location.href = `/player.html?room=${res.id}`;
        } else {
          showNotification('Ошибка: ' + (res.error || 'неизвестно'), 'error');
        }
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateAuthControls();
      loadRooms();
    });
  </script>
</body>
</html>
