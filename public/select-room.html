<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>SyncWatch — Select Room</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --primary: #4a90e2;
      --secondary: #343a40;
      --accent-start: #4a90e2;
      --accent-end: #8e44ad;
      --bg-dark: #121212;
      --bg-darker: #0d0d0d;
      --text: #ffffff;
      --text-secondary: #cccccc;
      --border: #333333;
      --shadow: rgba(0, 0, 0, 0.5);
      --hover-bg: #1e1e1e;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: var(--bg-dark);
      color: var(--text);
      padding: 2rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .header h1 {
      font-size: 2rem;
      color: var(--primary);
    }
    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .btn {
      padding: 0.6rem 1.2rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-start), var(--accent-end));
      color: white;
    }
    .btn-primary:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: var(--hover-bg);
    }
    .btn-logout {
      background: #e74c3c;
      color: white;
      border: none;
    }
    .btn-logout:hover {
      opacity: 0.9;
    }
    .room-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1rem;
    }
    .room-card {
      background: var(--secondary);
      border-radius: 8px;
      padding: 1.2rem;
      box-shadow: 0 4px 12px var(--shadow);
      transition: transform 0.2s ease;
      position: relative;
    }
    .room-card:hover {
      transform: translateY(-4px);
    }
    .room-card h3 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .room-card h3 i {
      color: var(--primary);
    }
    .room-info {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin: 0.5rem 0;
    }
    .video-info {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin: 0.5rem 0;
      padding-top: 0.5rem;
      border-top: 1px solid var(--border);
    }
    .room-actions {
      display: flex;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .join-btn {
      flex: 1;
      padding: 0.5rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
    }
    .join-btn:hover {
      opacity: 0.9;
    }
    .password-input {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      border: 1px solid var(--border);
      background: var(--bg-darker);
      color: var(--text);
      border-radius: 4px;
      display: none;
    }
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 1rem;
      background: var(--secondary);
      border-left: 4px solid var(--primary);
      border-radius: 4px;
      box-shadow: 0 4px 12px var(--shadow);
      z-index: 1000;
    }
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }
    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <div class="logo-icon">S</div>
      <h1>SyncWatch</h1>
    </div>
    <div class="controls" id="authControls">
      <!-- Кнопки будут добавлены скриптом -->
    </div>
  </div>

  <button id="createRoomBtn" class="btn btn-primary">Создать новую комнату</button>

  <div class="room-list" id="roomList">
    <!-- Комнаты будут загружены сюда -->
  </div>

  <div id="notifications"></div>

  <script>
    // === ПРОВЕРКА АВТОРИЗАЦИИ ПРИ ЗАГРУЗКЕ ===
    (function() {
      const token = localStorage.getItem('authToken');
      if (!token) {
        // Перенаправляем на страницу входа
        alert('Требуется авторизация');
        window.location.href = '/login.html';
        return;
      }
    })();

    const socket = io();
    let rooms = [];

    // Проверка авторизации
    function isAuthenticated() {
      return !!localStorage.getItem('authToken');
    }

    // Извлечение данных из JWT (если используется)
    function getUserInfo() {
      const token = localStorage.getItem('authToken');
      if (!token) return null;
      try {
        const payload = token.split('.')[1];
        if (!payload) return null;
        const decoded = JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/')));
        return decoded;
      } catch (e) {
        console.warn('Не удалось распарсить токен:', e);
        return null;
      }
    }

    // Обновление кнопок в шапке
    function updateAuthControls() {
      const controls = document.getElementById('authControls');
      if (isAuthenticated()) {
        const user = getUserInfo();
        const username = user?.username || 'Профиль';
        controls.innerHTML = `
          <a href="/user-player.html" class="btn btn-secondary">
            <i class="fas fa-user"></i> ${username}
          </a>
          <button id="logoutBtn" class="btn btn-logout">
            <i class="fas fa-sign-out-alt"></i> Выйти
          </button>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => {
          localStorage.removeItem('authToken');
          showNotification('Вы вышли из системы', 'info');
          window.location.href = '/login.html';
        });
      } else {
        // На случай, если токен пропал во время сессии
        window.location.href = '/login.html';
      }
    }

    function showNotification(message, type = 'info') {
      const notif = document.createElement('div');
      notif.className = 'notification';
      notif.textContent = message;
      document.getElementById('notifications').appendChild(notif);
      setTimeout(() => notif.remove(), 3000);
    }

    function formatTime(seconds) {
      if (typeof seconds !== 'number' || isNaN(seconds)) seconds = 0;
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function renderRooms() {
      const roomList = document.getElementById('roomList');
      if (rooms.length === 0) {
        roomList.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-users"></i>
            <h3>Нет активных комнат</h3>
            <p>Создайте новую комнату, чтобы начать совместный просмотр</p>
          </div>
        `;
        return;
      }

      roomList.innerHTML = rooms.map(room => `
        <div class="room-card" data-id="${room.id}">
          <h3>
            ${room.name}
            ${room.hasPassword ? '<i class="fas fa-lock" title="Защищена паролем"></i>' : '<i class="fas fa-lock-open" title="Публичная"></i>'}
          </h3>
          <div class="room-info">
            Пользователей: ${Object.keys(room.users || {}).length}
          </div>
          ${room.video ? `
            <div class="video-info">
              <strong>Видео:</strong> ${room.video.title || 'Без названия'}<br>
              <small>Текущее время: ${formatTime(room.video.currentTime)}</small><br>
              <small>Статус: ${room.video.isPlaying ? 'Играет' : 'Пауза'}</small>
            </div>
          ` : '<div class="video-info"><em>Видео не загружено</em></div>'}
          <input type="password" class="password-input" placeholder="Пароль комнаты" data-room-id="${room.id}">
          <div class="room-actions">
            <button class="join-btn" data-room-id="${room.id}">Войти</button>
          </div>
        </div>
      `).join('');

      // Обработчики кнопок входа
      document.querySelectorAll('.join-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const roomId = btn.dataset.roomId;
          const room = rooms.find(r => r.id === roomId);
          const passwordInput = document.querySelector(`.password-input[data-room-id="${roomId}"]`);
          
          let password = '';
          if (room && room.hasPassword) {
            password = passwordInput.value.trim();
            if (!password) {
              showNotification('Введите пароль для этой комнаты', 'error');
              passwordInput.focus();
              return;
            }
          }

          sessionStorage.setItem('roomPassword', password);
          window.location.href = `/player.html?room=${roomId}`;
        });
      });

      // Показываем поле пароля только если комната защищена
      document.querySelectorAll('.password-input').forEach(input => {
        const room = rooms.find(r => r.id === input.dataset.roomId);
        if (room && room.hasPassword) {
          input.style.display = 'block';
        }
      });
    }

    // Загрузка списка комнат через сокет
    function loadRooms() {
      socket.emit('get-rooms', (data) => {
        rooms = data || [];
        renderRooms();
      });
    }

    // Создание комнаты через сокет
    document.getElementById('createRoomBtn').addEventListener('click', () => {
      const name = prompt('Введите название комнаты:');
      if (!name || name.trim() === '') {
        showNotification('Название не может быть пустым', 'error');
        return;
      }

      const isProtected = confirm('Сделать комнату приватной (с паролем)?');
      let password = null;
      if (isProtected) {
        password = prompt('Введите пароль для комнаты:');
        if (!password || password.trim() === '') {
          showNotification('Пароль не может быть пустым', 'error');
          return;
        }
        password = password.trim();
      }

      socket.emit('create-room', { name: name.trim(), password }, (res) => {
        if (res.success) {
          showNotification(`Комната "${name}" создана`, 'success');
          if (password) {
            sessionStorage.setItem('roomPassword', password);
          }
          window.location.href = `/player.html?room=${res.id}`;
        } else {
          showNotification('Ошибка создания комнаты: ' + (res.error || 'Неизвестная ошибка'), 'error');
        }
      });
    });

    // Инициализация
    window.addEventListener('DOMContentLoaded', () => {
      updateAuthControls(); // Показываем нужные кнопки
      loadRooms(); // Первый запрос сразу при загрузке
      setInterval(loadRooms, 3000); // Затем каждые 3 секунды
    });
  </script>
</body>
</html>
