server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4096m;

    # Docker embedded DNS — lazy resolution at request time (allows nginx to start even if upstream containers are down)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Video streaming — no proxy buffering, pass Range headers, long timeout
    location ~* ^/api/v1/videos/stream/ {
        set $kong_upstream http://kong:8000;
        proxy_pass $kong_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # Health checks — bypass Kong, hit each service directly
    # rewrite strips /api/health/<svc> and passes the real health path to upstream
    location = /api/health/auth       { rewrite ^.*$ /health break;             set $u http://auth-service:8080;    proxy_pass $u; }
    location = /api/health/user       { rewrite ^.*$ /health break;             set $u http://user-service:8080;    proxy_pass $u; }
    location = /api/health/room       { rewrite ^.*$ /health break;             set $u http://room-service:8080;    proxy_pass $u; }
    location = /api/health/video      { rewrite ^.*$ /health break;             set $u http://video-service:8080;   proxy_pass $u; }
    location = /api/health/ws         { rewrite ^.*$ /health break;             set $u http://ws-gateway:8080;      proxy_pass $u; }
    location = /api/health/sync       { rewrite ^.*$ /health break;             set $u http://sync-service:8080;    proxy_pass $u; }
    location = /api/health/chat       { rewrite ^.*$ /health break;             set $u http://chat-service:8080;    proxy_pass $u; }
    location = /api/health/kong       { rewrite ^.*$ / break;                   set $u http://kong:8000;            proxy_pass $u; }
    location = /api/health/grafana    { rewrite ^.*$ /api/health break;         set $u http://grafana:3000;         proxy_pass $u; }
    location = /api/health/prometheus { rewrite ^.*$ /-/healthy break;          set $u http://prometheus:9090;      proxy_pass $u; }
    location = /api/health/jaeger     { rewrite ^.*$ / break;                   set $u http://jaeger:16686;         proxy_pass $u; }
    location = /api/health/minio      { rewrite ^.*$ /minio/health/live break;  set $u http://minio:9000;           proxy_pass $u; }

    # Infra monitoring — direct proxy to internal services (NATS, ScyllaDB)
    # Must be before /api/ to avoid being caught by Kong proxy
    location /api/infra/nats/ {
        rewrite ^/api/infra/nats/(.*)$ /$1 break;
        set $nats http://nats:8222;
        proxy_pass $nats;
        proxy_set_header Host nats;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 5s;
    }

    location /api/infra/scylla/ {
        rewrite ^/api/infra/scylla/(.*)$ /$1 break;
        set $scylla http://scylla:10000;
        proxy_pass $scylla;
        proxy_set_header Host scylla;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 5s;
    }

    # Proxy API requests → Kong
    location /api/ {
        set $kong http://kong:8000;
        proxy_pass $kong;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Proxy WebSocket → ws-gateway
    location /ws {
        set $ws http://ws-gateway:8080;
        proxy_pass $ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA routing — all paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
}
